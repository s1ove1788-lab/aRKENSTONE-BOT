# Пробная сборка APK: ветка android-push. Проверяет, что приложение собирается, но ничего не выкладывает
# и не тратит номера версий основной сборки.
name: Пробная сборка APK

on:
  push:
    branches: [android-push]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Firebase из Secrets (если задан)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            if echo "$GOOGLE_SERVICES_JSON" | grep -q '{'; then printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            else echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json; fi
          fi
      - name: Собрать APK (пробная, временная подпись)
        env:
          APP_VERSION_CODE: "1"
          APP_VERSION_NAME: "0.0.test"
        run: gradle assembleRelease --no-daemon
