# Собирает APK приложения Arkenstone и выкладывает его в «Releases» репозитория.
# Запускается сам при каждом изменении ветки android, или вручную: Actions → «Сборка APK» → Run workflow.
# Пробные сборки (ветка android-push) — отдельный файл apk-test.yml, чтобы не тратить номера версий.
name: Сборка APK

on:
  push:
    branches: [android]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Номер версии
        id: ver
        run: |
          # До перехода на 1.0.x было 8 сборок (1.1 … 1.8). Сборка 9 — это 1.0.1, 10 — 1.0.2 … 107 — 1.0.99, дальше 1.1.0.
          N=$(( ${{ github.run_number }} - 8 ))
          if [ "$N" -lt 1 ]; then N=1; fi
          NAME="1.$(( N / 100 )).$(( N % 100 ))"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Версия $NAME, сборка ${{ github.run_number }}"

      - name: Ключ подписи и Firebase из Secrets (если заданы)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          KS="${KEYSTORE_B64:-$KEYSTORE_BASE64}"
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > app/release.keystore; echo "Подпись: постоянный ключ"; else echo "Подпись: временный ключ (нет секрета KEYSTORE_BASE64)"; fi
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            if echo "$GOOGLE_SERVICES_JSON" | grep -q '{'; then printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            else echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json; fi
            echo "Firebase: подключён"
          else echo "Firebase: нет секрета GOOGLE_SERVICES_JSON — уведомления раз в 15 минут"; fi

      - name: Собрать APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          APP_VERSION_CODE: ${{ steps.ver.outputs.code }}
          APP_VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: gradle assembleRelease --no-daemon

      - name: Переименовать файл
        run: cp app/build/outputs/apk/release/app-release.apk Arkenstone.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Arkenstone-apk
          path: Arkenstone.apk

      - name: Что нового (первая строка описания изменения)
        id: notes
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          echo "text=$(printf '%s' "$MSG" | head -n1 | tr -d '\r' | cut -c1-200)" >> "$GITHUB_OUTPUT"

      - name: Выложить в Releases
        if: github.ref == 'refs/heads/android'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ steps.ver.outputs.name }}
          name: Arkenstone ${{ steps.ver.outputs.name }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Приложение Arkenstone для сотрудников. Скачайте Arkenstone.apk на телефон и установите.
            Новая версия ставится поверх старой, вход сохраняется.

            Сборка: ${{ steps.ver.outputs.code }}

            Что нового:
            ${{ steps.notes.outputs.text }}
          files: Arkenstone.apk
