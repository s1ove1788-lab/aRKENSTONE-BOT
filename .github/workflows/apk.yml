# Собирает APK приложения Arkenstone и выкладывает его в «Releases» репозитория.
# Запускается сам при каждом изменении ветки android, или вручную: Actions → «Сборка APK» → Run workflow.
name: Сборка APK

on:
  push:
    branches: [android]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Ключ подписи из Secrets (если задан)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > app/release.keystore; fi

      - name: Собрать APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Переименовать файл
        run: cp app/build/outputs/apk/release/app-release.apk Arkenstone.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Arkenstone-apk
          path: Arkenstone.apk

      - name: Выложить в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v1.${{ github.run_number }}
          name: Arkenstone 1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Приложение Arkenstone для сотрудников. Скачайте Arkenstone.apk на телефон и установите.
            Новая версия ставится поверх старой, вход сохраняется.
          files: Arkenstone.apk
