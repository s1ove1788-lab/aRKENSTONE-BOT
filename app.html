  ta.value = ta.value.slice(0, a) + e + ta.value.slice(b);
  const pos = a + e.length; ta.setSelectionRange(pos, pos);
  emojiRecent(e); ta.oninput();
  if (!("ontouchstart" in window)) ta.focus();  // на телефоне не открываем клавиатуру поверх панели
}

/* ------------------------------ меню сообщения: ответить, изменить, скопировать */
function msgMenu(ev, id){
  if (ev.target.closest("a")) return;  // нажали на ссылку или телефон — пусть открывается
  if (Date.now() - (window._swiped || 0) < 400) return;  // это было смахивание для ответа, а не нажатие
  const m = chat.msgs.find(x => x.id === id); if (!m) return;
  sheet(`<div class="menu"><div class="menu-msg">${m.photo ? "📷 " : ""}${esc(m.text || "Фото")}</div>
    <button class="btn" onclick="closeSheet();chatReply(${id})">↩️ Ответить</button>
    ${m.mine ? `<button class="btn" onclick="closeSheet();editMsg(${id})">✏️ Изменить</button>` : ""}
    ${m.text ? `<button class="btn" onclick="copyMsg(${id})">📋 Скопировать</button>` : ""}
    ${m.mine || (me.admin && !chat.peer) ? `<button class="btn" style="color:var(--warn)" onclick="deleteMsg(${id})">🗑 Удалить${m.mine ? "" : " (админ)"}</button>` : ""}
    ${m.photo ? `<button class="btn" onclick="closeSheet();viewPhoto('/chat-photo/${esc(m.photo)}')">🔍 Открыть фото</button>` : ""}
    <button class="btn" onclick="closeSheet()">Отмена</button></div>`);
}
async function deleteMsg(id){
  const m = chat.msgs.find(x => x.id === id); closeSheet(); if (!m) return;
  const who = m.mine ? "своё сообщение" : `сообщение от ${m.name}`;
  if (!confirm(`Удалить ${who} ${chat.peer ? "у вас обоих" : "у всех"}? Вернуть его будет нельзя.`)) return;
  try { await call(chatUrl("/delete"), {id}); toast("🗑 Удалено"); chatPoll(); }
  catch(e) { toast(e.message); }
}
async function copyMsg(id){
  const m = chat.msgs.find(x => x.id === id); closeSheet();
  try { await navigator.clipboard.writeText(m.text); toast("Скопировано"); }
  catch(e) {  // старые WebView без доступа к буферу
    const t = document.createElement("textarea"); t.value = m.text; document.body.appendChild(t); t.select();
    try { document.execCommand("copy"); toast("Скопировано"); } catch(_) { toast("Не вышло скопировать"); } t.remove();
  }
}
function chatReply(id){
  chat.reply = id || 0;
  const bar = $("#reply-bar"); if (!bar) return;
  const m = chat.msgs.find(x => x.id === id);
  bar.hidden = !m;
  if (m) {
    $("#reply-name").textContent = "Ответ: " + (m.mine ? "себе" : m.name);
    $("#reply-text").textContent = (m.photo ? "📷 " : "") + (m.text || "Фото");
    if (!("ontouchstart" in window)) $("#chat-in").focus();
  }
  window.scrollTo(0, document.body.scrollHeight);
}
function jumpTo(id){
  const el = document.querySelector(`.msg[data-id="${id}"]`);
  if (!el) return toast("Это сообщение уже не загружено");
  el.scrollIntoView({behavior: "smooth", block: "center"});
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
}
function viewPhoto(src){
  document.body.insertAdjacentHTML("beforeend", `<div class="viewer" onclick="this.remove()"><img src="${esc(src)}" alt=""><button class="xbtn" aria-label="Закрыть">×</button></div>`);
}
/* фото уменьшаем на телефоне до 1600 px — быстрее грузится и меньше места на сервере */
async function photoPick(input){
  const f = input.files && input.files[0]; input.value = "";
  if (!f) return;
  if (!/^image\//.test(f.type)) return toast("Это не фото");
  try {
    const bmp = await new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = bad; i.src = URL.createObjectURL(f); });
    const k = Math.min(1, 1600 / Math.max(bmp.naturalWidth, bmp.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.naturalWidth * k); c.height = Math.round(bmp.naturalHeight * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height); URL.revokeObjectURL(bmp.src);
    chat.photo = await new Promise(ok => c.toBlob(ok, "image/jpeg", 0.82));
  } catch(e) { chat.photo = f.size <= 8e6 ? f : null; if (!chat.photo) return toast("Фото слишком большое"); }
  $("#photo-prev").src = URL.createObjectURL(chat.photo); $("#photo-bar").hidden = false; goSync();
  window.scrollTo(0, document.body.scrollHeight);
}
function photoClear(){ chat.photo = null; const b = $("#photo-bar"); if (b) b.hidden = true; goSync(); }

/* ------------------------------ личные сообщения: список людей */
const LIST_TOP = `<div class="chat-top"><div class="chat-head"><b class="ttl">Чаты</b></div></div>`;
async function dmListOpen(){
  chatMarkSeen();  // уходим из общего чата — всё, что в нём было, уже видели
  clearTimeout(chat.timer); clearInterval(timer); ++nav; onPage = false;
  chat = CHAT_ALL; chatView = "list";
  document.querySelectorAll(".composer").forEach(e => e.remove());
  document.body.classList.remove("emoji"); $("#main").style.paddingBottom = "";
  if (!window._dmList) $("#main").innerHTML = LIST_TOP + `<div class="empty">Загрузка…</div>`;
  else dmListDraw();
  await dmListPoll();
}
function dmBack(){ chat = CHAT_ALL; chatView = "feed"; clearTimeout(window._dmListT); chatOpen(); }
async function dmListPoll(){
  clearTimeout(window._dmListT);
  if (tab !== "chat" || chatView !== "list") return;
  try { window._dmList = await call("/api/dm/list?seen=" + chatSeen()); } catch(e) { if (!window._dmList) { $("#main").innerHTML = LIST_TOP + `<div class="empty">${esc(e.message)}</div>`; } }
  if (tab !== "chat" || chatView !== "list") return;
  if (window._dmList) {
    window._dmUnread = window._dmList.people.reduce((a, p) => a + p.unread, 0);
    dmListDraw(); chatBadge();
  }
  window._dmListT = setTimeout(dmListPoll, 3000);
}
function dmListDraw(){
  const d = window._dmList, y = window.scrollY, g = d.general || {};
  const time = t => { const day = chatDay(t); return day === "Сегодня" ? (t || "").slice(11, 16) : day; };
  const row = p => `<div class="dm-row" onclick="dmOpen('${esc(p.code)}')">
      <div class="ava" style="background:${hue(p.name)}">${ava1(p.name)}${p.online ? `<i class="ava-on"></i>` : ""}</div>
      <div class="grow" style="min-width:0"><div class="row"><b class="grow dm-name">${esc(p.name)}</b>
        ${p.last ? `<small class="muted" style="margin:0">${esc(time(p.last.t))}</small>` : ""}</div>
        <div class="row"><span class="grow dm-last ${p.unread ? "new" : ""}">${p.last ? (p.last.mine ? "Вы: " : "") + esc(p.last.text)
          : `<span class="dm-st ${p.online ? "online" : ""}" style="display:inline">${presenceHtml(p)}${p.label ? ` · ${esc(p.label)}` : ""}</span>`}</span>
        ${p.unread ? `<b class="dm-badge">${p.unread}</b>` : ""}</div></div></div>`;
  const all = `<div class="dm-row" onclick="dmBack()"><div class="ava all">💬</div>
      <div class="grow" style="min-width:0"><div class="row"><b class="grow dm-name">Общий чат</b>
        ${g.last ? `<small class="muted" style="margin:0">${esc(time(g.last.t))}</small>` : ""}</div>
        <div class="row"><span class="grow dm-last ${g.unread ? "new" : ""}">${g.last ? esc((g.last.mine ? "Вы" : g.last.name) + ": " + g.last.text)
          : (g.total ? `${g.online || 0} из ${g.total} в сети` : "Все сотрудники")}</span>
        ${g.unread ? `<b class="dm-badge">${g.unread > 99 ? "99+" : g.unread}</b>` : ""}</div></div></div>`;
  const talk = d.people.filter(p => p.last), rest = d.people.filter(p => !p.last);
  $("#main").innerHTML = LIST_TOP +
    (me.admin && !d.persistent ? `<div class="card late" style="font-size:14px">⚠️ Личная переписка сейчас хранится во временной папке и пропадёт при обновлении бота.</div>` : "") +
    `<div class="clist">${all}${talk.map(row).join("")}</div>` +
    (rest.length ? `<h2>Написать лично</h2><div class="clist">${rest.map(row).join("")}</div>` : "") +
    `<p class="muted" style="text-align:center;margin-top:14px">Личную переписку видите только вы и собеседник</p>`;
  window.scrollTo(0, y);
}
function dmOpen(code){
  const p = (window._dmList ? window._dmList.people : []).find(x => x.code === code); if (!p) return;
  clearTimeout(window._dmListT);
  const r = dmRooms[code] || (dmRooms[code] = {msgs: [], rev: 0, last: 0, epoch: "", busy: false, timer: null, sending: false,
                                               reply: 0, photo: null, peer: code});
  r.name = p.name; r.label = p.label; r.presence = {online: p.online, seen: p.seen};
  r.newFrom = 0; r.wantNew = p.unread || 0;
  window._allUnread = (window._dmList.general || {}).unread || 0;
  chat = r; chatView = "feed";
  if (p.unread) { window._dmUnread = Math.max(0, (window._dmUnread || 0) - p.unread); p.unread = 0; }
  chatOpen();
}

async function chatSend(){
  const ta = $("#chat-in"), text = ta.value.trim(), room = chat, photo = room.photo, reply = room.reply || 0;
  if (!text && !photo) return;
  // в ленту сразу, с часиками; поле ввода очищается — можно писать следующее, не дожидаясь сервера
  const p = {tmp: "t" + Date.now() + Math.random().toString(36).slice(2, 6), text, photo: !!photo};
  (room.pending = room.pending || []).push(p);
  ta.value = ""; grow(ta); try { localStorage.removeItem(draftKey()); } catch(e) {}
  chatReply(0); if (photo) photoClear();
  room.newFrom = 0; const nm = document.getElementById("chat-new"); if (nm) nm.remove();
  goSync(); pendingSync(); window.scrollTo(0, document.body.scrollHeight);
  if (!("ontouchstart" in window) || $("#emoji").hidden) ta.focus();
  try {
    let r;
    if (photo) {
      const res = await fetch("/api/chat/photo", {method: "POST", body: photo,
        headers: {"X-Token": TOKEN, "Content-Type": photo.type || "image/jpeg",
                  "X-Caption": encodeURIComponent(text), "X-Reply": String(reply), "X-Peer": room.peer || ""}});
      try { r = await res.json(); } catch(e) { r = {}; }
      if (!res.ok || r.error) throw new Error(r.error || "Не получилось отправить фото");
    } else {
      r = await call((room.peer ? "/api/dm" : "/api/chat") + "/send", {text, reply, peer: room.peer || ""});
    }
    p.real = r.id;
    if (room === chat) { pendingSync(); if (!room.busy) chatPoll(room); }  // долгий запрос и так вернётся сразу
  } catch(e) {
    room.pending = room.pending.filter(x => x !== p);
    if (room === chat) {
      pendingSync();
      if (!ta.value.trim()) { ta.value = text; grow(ta); }  // текст не теряем — можно нажать «Отправить» ещё раз
    }
    toast(e.message);
  }
}

if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
boot();
</script>
