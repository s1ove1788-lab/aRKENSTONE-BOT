<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arkenstone</title>
<meta name="theme-color" content="#1d2a24">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
:root{
  --bg:#f3f1ec; --card:#ffffff; --ink:#1c1f1d; --muted:#6c716d; --line:#e2dfd7;
  --accent:#1f6b4f; --accent-ink:#ffffff; --warn:#b4531a; --warn-bg:#fbeee4;
  --ok-bg:#e5f2ec; --bar:#1d2a24; --bar-ink:#e9efe9; --chip:#ece9e1;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121614; --card:#1b201d; --ink:#e8ebe8; --muted:#97a09a; --line:#2b322e;
    --accent:#4fb487; --accent-ink:#0d1a13; --warn:#f0965a; --warn-bg:#33231a;
    --ok-bg:#1d2d25; --bar:#0d110f; --bar-ink:#e9efe9; --chip:#252b27;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bar);color:var(--bar-ink);
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:12px}
header h1{font-size:18px;margin:0;flex:1;letter-spacing:.2px}
header .who{font-size:13px;opacity:.75}
.iconbtn{background:none;border:0;color:inherit;font-size:22px;padding:4px 6px;cursor:pointer}
main{padding:16px 16px calc(96px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);
  display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;color:var(--muted);padding:8px 2px;font-size:12px;
  display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:12px;cursor:pointer}
nav button span{font-size:22px}
nav button.on{color:var(--accent);background:var(--chip);font-weight:600}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:22px 4px 10px}
h2:first-child{margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.card.late{border-color:var(--warn);background:var(--warn-bg)}
.card .top{display:flex;align-items:flex-start;gap:10px;cursor:pointer}
.card .title{font-weight:600;flex:1;font-size:17px}
.card .sub{color:var(--muted);font-size:14px;margin-top:2px}
.badge{background:var(--chip);border-radius:999px;padding:2px 10px;font-size:14px;font-weight:600;white-space:nowrap}
.late .badge{background:var(--warn);color:#fff}
.lines{margin:10px 0 0;padding:0;list-style:none}
.lines li{padding:6px 0;border-top:1px dashed var(--line)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.btn{border:0;border-radius:12px;padding:14px 12px;font-size:16px;font-weight:600;cursor:pointer;
  background:var(--chip);color:var(--ink);text-align:center;text-decoration:none;display:block}
.btn.main{background:var(--accent);color:var(--accent-ink)}
.btn.wide{grid-column:1/-1}
.btn:disabled{opacity:.5}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:26px}
.stat small{color:var(--muted);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:8px 4px;border-top:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:500;font-size:13px;border-top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.short td{color:var(--warn);font-weight:600}
pre{white-space:pre-wrap;font:inherit;margin:0}
input,select{width:100%;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--line);
  background:var(--bg);color:var(--ink);margin-bottom:8px}
.code{font:700 34px/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:3px;text-align:center;
  padding:18px;border-radius:16px;background:var(--chip);margin:14px 0;user-select:all}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;z-index:9;max-width:90vw;
  opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.row{display:flex;align-items:center;gap:10px}
.row .grow{flex:1}
.muted{color:var(--muted);font-size:14px}
details summary{cursor:pointer;font-weight:600;list-style:none}
details summary::-webkit-details-marker{display:none}
.spin{opacity:.6}
nav[hidden]{display:none}
.tap{cursor:pointer}
.tap:active{background:var(--chip)}
tr.tap td:last-child::after{content:" ›";color:var(--muted)}
.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.big{font-size:18px;padding:18px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:20px 20px 0 0;
  padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h3{margin:0 0 4px;font-size:19px}
.sheet .muted{margin-bottom:12px}
.stepper{display:grid;grid-template-columns:64px 1fr 64px;gap:8px;margin:10px 0}
.stepper input{text-align:center;font-size:24px;font-weight:700;margin:0}
.stepper .btn{font-size:24px;padding:10px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.seg button{flex:1;min-width:64px;border:1px solid var(--line);background:var(--bg);color:var(--ink);
  border-radius:10px;padding:10px 6px;font:inherit;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
label.l{display:block;font-size:13px;color:var(--muted);margin:6px 2px 4px}
.result{white-space:pre-wrap;background:var(--ok-bg);border-radius:12px;padding:12px;margin-top:10px}
.badge:empty{display:none}
</style>
</head>
<body>
<header>
  <h1>Arkenstone</h1>
  <div class="who" id="who"></div>
  <button class="iconbtn" id="refresh" aria-label="Обновить">⟳</button>
</header>
<main id="main"><div class="empty">Загрузка…</div></main>
<nav id="nav" hidden></nav>
<div class="toast" id="toast"></div>

<script>
const TABS = {courier:["🚚","Курьер"], prod:["🏭","Производство"], keeper:["📦","Склад"], manager:["👔","Менеджер"]};
const ROLES = {courier:"Курьер", prod:"Производство", keeper:"Кладовщик", manager:"Менеджер"};
let me = null, tab = null, timer = null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function token(){
  let t = null;
  try { t = localStorage.getItem("ark_token"); } catch(e) {}
  if (!t) {
    const b = new Uint8Array(32); crypto.getRandomValues(b);
    t = Array.from(b, x => x.toString(16).padStart(2,"0")).join("");
    try { localStorage.setItem("ark_token", t); } catch(e) {}
  }
  return t;
}
const TOKEN = token();

async function call(path, body){
  const r = await fetch(path, {method: body ? "POST" : "GET",
    headers: {"X-Token": TOKEN, "Content-Type": "application/json"},
    body: body ? JSON.stringify(body) : undefined});
  let data = {};
  try { data = await r.json(); } catch(e) {}
  if (r.status === 403) { me = null; boot(); throw new Error(data.error || "Нет доступа"); }
  if (!r.ok) throw new Error(data.error || "Ошибка связи");
  return data;
}

function toast(text){
  const t = $("#toast"); t.textContent = text; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2600);
}

async function boot(){
  try {
    me = await call("/api/me");
  } catch(e) {
    $("#main").innerHTML = `<div class="empty">Нет связи с сервером.<br><br><button class="btn" onclick="boot()">Повторить</button></div>`;
    return;
  }
  if (!me.ok) return showCode();
  $("#who").textContent = (me.name ? me.name + " · " : "") + me.label;
  const nav = $("#nav");
  nav.hidden = me.tabs.length < 2;
  nav.innerHTML = me.tabs.map(k => `<button data-tab="${k}"><span>${TABS[k][0]}</span>${TABS[k][1]}</button>`).join("");
  nav.querySelectorAll("button").forEach(b => b.onclick = () => open(b.dataset.tab));
  let saved = null; try { saved = localStorage.getItem("ark_tab"); } catch(e) {}
  open(me.tabs.includes(saved) ? saved : me.tabs[0]);
}

function showCode(){
  $("#nav").hidden = true; $("#who").textContent = "";
  $("#main").innerHTML = `
    <div class="card">
      <div class="title">Добро пожаловать</div>
      <p class="muted">Это рабочее приложение компании. Отправьте этот код менеджеру — он добавит вас, и откроется ваш экран.</p>
      <div class="code">${esc(me.code)}</div>
      <div class="actions">
        <button class="btn" id="copy">Скопировать</button>
        <button class="btn" id="share">Отправить</button>
        <button class="btn main wide" id="check">Проверить доступ</button>
      </div>
    </div>`;
  $("#copy").onclick = async () => { try { await navigator.clipboard.writeText(me.code); toast("Код скопирован"); } catch(e) { toast("Не вышло, перепишите код вручную"); } };
  $("#share").onclick = async () => {
    const text = `Мой код для приложения Arkenstone: ${me.code}`;
    if (navigator.share) { try { await navigator.share({text}); } catch(e) {} }
    else { try { await navigator.clipboard.writeText(text); toast("Текст скопирован"); } catch(e) {} }
  };
  $("#check").onclick = () => { toast("Проверяю…"); boot(); };
}

function open(k){
  tab = k; try { localStorage.setItem("ark_tab", k); } catch(e) {}
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === k));
  load();
}

async function load(){
  clearInterval(timer);
  $("#refresh").classList.add("spin");
  try {
    const data = await call("/api/" + tab);
    ({courier: drawCourier, prod: drawProd, keeper: drawKeeper, manager: drawManager})[tab](data);
  } catch(e) {
    if (me) $("#main").innerHTML = `<div class="empty">${esc(e.message)}<br><br><button class="btn" onclick="load()">Повторить</button></div>`;
  } finally {
    $("#refresh").classList.remove("spin");
    timer = setInterval(() => { if (!document.querySelector(".open-form, .sheet-bg")) load(); }, 60000);
  }
}
$("#refresh").onclick = () => me && me.ok ? load() : boot();
document.addEventListener("visibilitychange", () => { if (!document.hidden && me && me.ok) load(); });

/* ------------------------------ окно-форма снизу */
function sheet(html){
  closeSheet();
  document.body.insertAdjacentHTML("beforeend", `<div class="sheet-bg" onclick="if(event.target===this)closeSheet()"><div class="sheet">${html}</div></div>`);
  return document.querySelector(".sheet");
}
function closeSheet(){ document.querySelectorAll(".sheet-bg").forEach(e => e.remove()); }
function stepper(id, val){
  return `<div class="stepper"><button class="btn" onclick="step('${id}',-1)">−</button>
    <input id="${id}" type="number" inputmode="decimal" min="0" value="${val}"><button class="btn" onclick="step('${id}',1)">+</button></div>`;
}
function step(id, d){ const i = document.getElementById(id); i.value = Math.max(0, (parseFloat(i.value.replace(",", ".")) || 0) + d); }
function seg(id, opts, on){
  return `<div class="seg" id="${id}" data-v="${esc(on)}">${Object.entries(opts).map(([k,v]) =>
    `<button class="${k===on?"on":""}" data-k="${esc(k)}" onclick="pick(this)">${esc(v)}</button>`).join("")}</div>`;
}
function pick(b){ const g = b.parentNode; g.dataset.v = b.dataset.k; g.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); }
async function act(btn, path, body, keepOpen){
  btn.disabled = true;
  try {
    const r = await call(path, body);
    if (keepOpen) { const box = btn.closest(".sheet"); box.querySelector(".result")?.remove();
      box.insertAdjacentHTML("beforeend", `<div class="result">${esc(r.message)}</div>`); btn.disabled = false; }
    else { closeSheet(); toast(r.message.split("\n")[0]); }
    load();
  } catch(e) { toast(e.message); btn.disabled = false; }
}
const num = id => parseFloat(String(document.getElementById(id).value).replace(",", ".")) || 0;

/* ------------------------------ курьер */
function drawCourier(d){
  const card = (kind, it, inner, sub) => `
    <div class="card ${it.late ? "late" : ""}" data-kind="${kind}" data-key="${esc(it.key)}">
      <div class="top" onclick="this.parentNode.querySelector('.body').hidden^=1">
        <div class="grow"><div class="title">${inner}</div>${sub ? `<div class="sub">${sub}</div>` : ""}</div>
        <span class="badge">${it.late ? "просрочен" : (it.count ? it.count + " шт." : "")}</span>
      </div>
      <div class="body" hidden>
        ${it.lines ? `<ul class="lines">${it.lines.map(l => `<li>${esc(l)}</li>`).join("")}</ul>` : ""}
        <div class="actions">
          ${it.tel ? `<a class="btn" href="tel:${esc(it.tel)}">📞 Позвонить</a>` : ""}
          ${it.address && kind === "city" ? `<a class="btn" target="_blank" href="https://yandex.ru/maps/?text=${encodeURIComponent(it.address)}">🗺 Карта</a>` : ""}
          <button class="btn main wide" onclick="done(this)">✅ Доставлен</button>
          <button class="btn wide" onclick="moveForm(this)">📅 Перенос</button>
        </div>
      </div>
    </div>`;
  window._ret = d.returns;
  let h = `<div class="toolbar"><button class="btn" onclick="returnForm()">↩️ Возврат</button>
    <button class="btn" onclick="payView()">💰 Расчёт</button></div>`;
  if (!d.ru.length && !d.city.length) h += `<div class="empty">На сегодня (${d.date}) доставок нет 🎉</div>`;
  if (d.ru.length) h += `<h2>По России · ${d.date}</h2>` + d.ru.map(g => card("ru", g, esc(g.title))).join("");
  if (d.city.length) h += `<h2>Город · ${d.date}</h2>` + d.city.map(o =>
    card("city", o, esc(o.address), `${esc(o.item)}${o.phone ? " · " + esc(o.phone) : ""}<br>${esc(o.title)}`)).join("");
  h += `<h2>Дальше</h2>` + d.ahead.map(a => `
    <details class="card"><summary class="row"><span class="grow">📅 ${a.label}</span><span class="badge">${a.count} шт.</span></summary>
    <pre style="margin-top:10px">${esc(a.text.split("\n").slice(1).join("\n").trim())}</pre></details>`).join("");
  $("#main").innerHTML = h;
}

async function done(btn){
  const c = btn.closest(".card");
  if (!confirm("Отметить как доставленный?")) return;
  btn.disabled = true;
  try { const r = await call("/api/courier/done", {kind: c.dataset.kind, key: c.dataset.key}); toast(r.message); }
  catch(e) { toast(e.message); }
  load();
}

function moveForm(btn){
  const c = btn.closest(".card");
  const box = btn.parentNode;
  if (box.querySelector(".open-form")) return;
  const t = new Date(); t.setDate(t.getDate() + 1);
  const min = t.toISOString().slice(0,10);
  box.insertAdjacentHTML("beforeend", `<div class="wide open-form" style="grid-column:1/-1">
    <input type="date" min="${min}" value="${min}">
    <div class="actions" style="margin-top:0">
      <button class="btn" onclick="this.closest('.open-form').remove()">Отмена</button>
      <button class="btn main" onclick="move(this)">Перенести</button>
    </div></div>`);
}

async function move(btn){
  const c = btn.closest(".card");
  const date = btn.closest(".open-form").querySelector("input").value;
  btn.disabled = true;
  try { const r = await call("/api/courier/move", {kind: c.dataset.kind, key: c.dataset.key, date}); toast(r.message); }
  catch(e) { toast(e.message); btn.disabled = false; return; }
  load();
}

function returnForm(){
  const r = window._ret;
  const codes = Object.fromEntries(r.codes.map(c => [c.code, c.name.replace("/30 ", " ")]));
  sheet(`<h3>↩️ Возврат</h3><div class="muted">Кровать сразу добавится в остатки склада и в расчёт.</div>
    <label class="l">Площадка</label>${seg("r-kind", r.kinds, "ya")}
    <label class="l">Кровать</label>${seg("r-code", codes, r.codes[0].code)}
    <label class="l">Ножки</label>${seg("r-legs", {"25":"25","30":"30","35":"35"}, "30")}
    <label class="l">Сколько</label>${stepper("r-qty", 1)}
    <button class="btn main big" style="width:100%" onclick="act(this,'/api/courier/return',{kind:document.getElementById('r-kind').dataset.v,
      code:document.getElementById('r-code').dataset.v, legs:document.getElementById('r-legs').dataset.v, qty:num('r-qty')}, true)">Записать возврат</button>`);
}

async function payView(){
  const box = sheet(`<h3>💰 Расчёт доставок</h3><div class="muted">Загрузка…</div>`);
  try {
    const r = await call("/api/courier/pay");
    box.innerHTML = `<h3>💰 Расчёт доставок</h3><pre style="margin:10px 0">${esc(r.text)}</pre>` +
      (r.url ? `<a class="btn" target="_blank" href="${esc(r.url)}">📊 Открыть таблицу</a>` : "");
  } catch(e) { box.querySelector(".muted").textContent = e.message; }
}

/* ------------------------------ производство */
function drawProd(d){
  window._prod = d;
  const stock = d.stock.map((x, i) => {
    const short = x.have !== null && x.need > x.have;
    return `<tr class="tap ${short ? "short" : ""}" onclick="stockForm(${i})"><td>${esc(x.name)}</td><td class="n">${x.have ?? "—"}</td><td class="n">${x.need || ""}</td></tr>`;
  }).join("");
  const frames = d.frames.map((f, i) => `<tr class="tap" onclick="frameForm(${i})"><td>${f.width}</td><td class="n">${f.n}</td></tr>`).join("");
  $("#main").innerHTML = `
    ${d.today ? `<button class="btn main big" style="width:100%;margin-bottom:10px" onclick="shippedForm()">✅ Кровати отгружены · ${d.today} шт.</button>`
      : `<div class="card muted" style="text-align:center">${d.shipped ? `Сегодня отгружено ${d.shipped} шт. ✅` : "На сегодня отгрузок нет"}</div>`}
    <h2>Покрашенные · нажмите, чтобы внести</h2><div class="card"><table><tr><th>Кровать</th><th class="n">Есть</th><th class="n">Нужно</th></tr>${stock}</table></div>
    <h2>Сваренные каркасы</h2><div class="card"><table>${frames}</table></div>
    <h2>План</h2><div class="card"><pre>${esc(d.plan.split("\n").slice(2).join("\n"))}</pre></div>`;
}

function shippedForm(){
  sheet(`<h3>Кровати отгружены?</h3><div class="muted">Отметим ${window._prod.today} шт. на сегодня и сообщим менеджеру.</div>
    <div class="actions"><button class="btn" onclick="closeSheet()">Отмена</button>
    <button class="btn main" onclick="act(this,'/api/prod/shipped',{})">Да, отгружены</button></div>`);
}

function stockForm(i){
  const x = window._prod.stock[i];
  sheet(`<h3>🎨 ${esc(x.name)}</h3><div class="muted">Сейчас покрашено: ${x.have ?? "нет данных"}. Добавленные спишутся со сваренных каркасов.</div>
    ${stepper("s-n", 1)}
    <div class="actions"><button class="btn" onclick="act(this,'/api/prod/stock',{code:'${x.code}',delta:-num('s-n')})">− Убрать</button>
    <button class="btn main" onclick="act(this,'/api/prod/stock',{code:'${x.code}',delta:num('s-n')})">+ Добавить</button></div>`);
}

function frameForm(i){
  const f = window._prod.frames[i];
  sheet(`<h3>🔩 Каркасы ${f.width}</h3><div class="muted">Сейчас сварено: ${f.n} шт.</div>
    ${stepper("f-n", 1)}
    <div class="actions"><button class="btn" onclick="act(this,'/api/prod/frames',{width:${f.width},delta:-num('f-n')})">− Убрать</button>
    <button class="btn main" onclick="act(this,'/api/prod/frames',{width:${f.width},delta:num('f-n')})">+ Сварено</button></div>`);
}

/* ------------------------------ склад */
const INV = {raw:"Сырьё", tmc:"ТМЦ"};
function drawKeeper(d){
  window._inv = d;
  const list = kind => `<h2>${INV[kind]}</h2><div class="card">` + (d[kind].length
    ? `<table>${d[kind].map((i, n) => `<tr class="tap ${i.low ? "short" : ""}" onclick="invForm('${kind}',${n})"><td>${esc(i.name)}${i.low ? " · заканчивается" : ""}</td><td class="n">${esc(i.qty)} ${esc(i.unit)}</td></tr>`).join("")}</table>`
    : `<div class="muted">Пока пусто</div>`) +
    `<button class="btn" style="width:100%;margin-top:10px" onclick="invNew('${kind}')">🆕 Новая позиция</button></div>`;
  $("#main").innerHTML = list("raw") + list("tmc");
}

function invForm(kind, n){
  const i = window._inv[kind][n];
  const body = sign => `{kind:'${kind}',row:${i.row},name:${esc(JSON.stringify(i.name))},qty:num('i-n'),sign:'${sign}'}`;
  sheet(`<h3>${esc(i.name)}</h3><div class="muted">Сейчас: ${esc(i.qty)} ${esc(i.unit)}${i.min ? ` · минимум ${esc(i.min)}` : ""}</div>
    ${stepper("i-n", 1)}
    <div class="actions"><button class="btn" onclick="act(this,'/api/keeper/move',${body("out")})">➖ Расход</button>
    <button class="btn main" onclick="act(this,'/api/keeper/move',${body("in")})">➕ Приход</button></div>`);
}

function invNew(kind){
  sheet(`<h3>🆕 ${INV[kind]}: новая позиция</h3><div class="muted">Остаток будет 0 — потом внесите приход.</div>
    <label class="l">Название</label><input id="n-name" placeholder="Труба 40×20">
    <label class="l">Единица</label><input id="n-unit" placeholder="м, шт, л, кг">
    <label class="l">Минимум (предупредим, когда меньше)</label><input id="n-min" type="number" inputmode="decimal" placeholder="необязательно">
    <button class="btn main big" style="width:100%" onclick="act(this,'/api/keeper/new',{kind:'${kind}',name:document.getElementById('n-name').value,
      unit:document.getElementById('n-unit').value,min:document.getElementById('n-min').value})">Добавить</button>`);
}

/* ------------------------------ менеджер */
function drawManager(d){
  $("#main").innerHTML = `
    <div class="stats"><div class="stat"><b>${d.today}</b><small>отгрузить сегодня</small></div>
      <div class="stat"><b>${d.open}</b><small>в работе</small></div>
      <div class="stat"><b>${d.city}</b><small>по городу</small></div></div>
    <label class="btn main big" style="margin:10px 0">📄 Загрузить PDF с заказами
      <input type="file" accept="application/pdf,.pdf" hidden onchange="uploadPdf(this)"></label>
    ${d.links.length ? `<div class="toolbar">${d.links.map(l => `<a class="btn" target="_blank" href="${esc(l.url)}">${esc(l.title)}</a>`).join("")}</div>` : ""}
    <h2>Добавить сотрудника</h2>
    <div class="card open-form" id="addform">
      <input id="f-code" placeholder="Код с телефона, например K7QM-2XPA" autocapitalize="characters" autocomplete="off">
      <input id="f-name" placeholder="Имя">
      <select id="f-role">${Object.entries(ROLES).map(([k,v]) => `<option value="${k}">${v}</option>`).join("")}</select>
      <button class="btn main" style="width:100%" onclick="addDevice(this)">Добавить</button>
    </div>
    <h2>Сотрудники в приложении</h2>
    ${d.devices.length ? d.devices.map(x => `
      <div class="card row"><div class="grow"><div class="title">${esc(x.name || "без имени")}</div>
      <div class="sub">${esc(x.label)} · ${esc(x.code)}</div></div>
      ${x.code === me.code ? `<span class="badge">это вы</span>` : `<button class="btn" onclick="removeDevice('${esc(x.code)}','${esc(x.name)}')">Убрать</button>`}</div>`).join("")
      : `<div class="empty">Пока никого</div>`}`;
}

async function uploadPdf(input){
  const f = input.files[0]; input.value = "";
  if (!f) return;
  const box = sheet(`<h3>📄 ${esc(f.name)}</h3><div class="muted">Читаю файл…</div>`);
  try {
    const r = await fetch("/api/manager/pdf", {method: "POST", body: f,
      headers: {"X-Token": TOKEN, "X-Filename": encodeURIComponent(f.name), "Content-Type": "application/pdf"}});
    const j = await r.json().catch(() => ({}));
    box.innerHTML = `<h3>📄 ${esc(f.name)}</h3><div class="result">${esc(j.message || j.error || "Ошибка связи")}</div>
      <button class="btn" style="width:100%;margin-top:10px" onclick="closeSheet()">Готово</button>`;
    load();
  } catch(e) { box.querySelector(".muted").textContent = e.message; }
}

async function addDevice(btn){
  btn.disabled = true;
  try {
    await call("/api/manager/device", {code: $("#f-code").value, name: $("#f-name").value, role: $("#f-role").value});
    toast("Добавлено"); $("#f-code").value = ""; $("#f-name").value = ""; load();
  } catch(e) { toast(e.message); }
  btn.disabled = false;
}

async function removeDevice(code, name){
  if (!confirm(`Убрать ${name || code} из приложения?`)) return;
  try { await call("/api/manager/device/remove", {code}); toast("Убрано"); } catch(e) { toast(e.message); }
  load();
}

if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
boot();
</script>
