<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arkenstone</title>
<meta name="theme-color" content="#1d2a24">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<script>try { const t = localStorage.getItem("ark_theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch(e) {}</script>
<style>
:root{
  --bg:#f3f1ec; --card:#ffffff; --ink:#1c1f1d; --muted:#6c716d; --line:#e2dfd7;
  --accent:#1f6b4f; --accent-ink:#ffffff; --warn:#b4531a; --warn-bg:#fbeee4;
  --ok-bg:#e5f2ec; --bar:#1d2a24; --bar-ink:#e9efe9; --chip:#ece9e1;
}
/* Тема: «как в телефоне» (по умолчанию) или выбранная в приложении — атрибут data-theme на <html> */
:root{color-scheme:light}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121614; --card:#1b201d; --ink:#e8ebe8; --muted:#97a09a; --line:#2b322e;
    --accent:#4fb487; --accent-ink:#0d1a13; --warn:#f0965a; --warn-bg:#33231a;
    --ok-bg:#1d2d25; --bar:#0d110f; --bar-ink:#e9efe9; --chip:#252b27;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#121614; --card:#1b201d; --ink:#e8ebe8; --muted:#97a09a; --line:#2b322e;
    --accent:#4fb487; --accent-ink:#0d1a13; --warn:#f0965a; --warn-bg:#33231a;
    --ok-bg:#1d2d25; --bar:#0d110f; --bar-ink:#e9efe9; --chip:#252b27;
    color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bar);color:var(--bar-ink);
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:12px}
header h1{font-size:18px;margin:0;flex:1;letter-spacing:.2px}
/* ---------- новогодняя гирлянда в шапке (рисует xmasDraw, нажатиям не мешает) */
header.xmas{padding-bottom:22px}
header.xmas + main{padding-top:34px}  /* шарики висят ниже шапки — отодвигаем начало экрана */
.xmas-svg{position:absolute;left:0;right:0;bottom:-16px;height:40px;pointer-events:none;overflow:visible}
.xmas-svg .bulb{animation:twinkle 1.6s ease-in-out infinite}
.xmas-svg .ball{transform-box:fill-box;transform-origin:50% 0;animation:swing 3.2s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:1;filter:drop-shadow(0 0 3px currentColor)}50%{opacity:.35;filter:none}}
@keyframes swing{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@media (prefers-reduced-motion: reduce){.xmas-svg .bulb,.xmas-svg .ball{animation:none}}
header .who{font-size:13px;opacity:.75}
.iconbtn{background:none;border:0;color:inherit;font-size:22px;padding:4px 6px;cursor:pointer}
main{padding:16px 16px calc(96px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);
  display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;color:var(--muted);padding:8px 2px;font-size:12px;
  display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:12px;cursor:pointer}
nav button span{font-size:22px}
nav button.on{color:var(--accent);background:var(--chip);font-weight:600}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:22px 4px 10px}
h2:first-child{margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.card.late{border-color:var(--warn);background:var(--warn-bg)}
.card .top{display:flex;align-items:flex-start;gap:10px;cursor:pointer}
.card .title{font-weight:600;flex:1;font-size:17px}
.card .sub{color:var(--muted);font-size:14px;margin-top:2px}
.badge{background:var(--chip);border-radius:999px;padding:2px 10px;font-size:14px;font-weight:600;white-space:nowrap}
.late .badge{background:var(--warn);color:#fff}
.lines{margin:10px 0 0;padding:0;list-style:none}
.lines li{padding:6px 0;border-top:1px dashed var(--line)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.btn{border:0;border-radius:12px;padding:14px 12px;font-size:16px;font-weight:600;cursor:pointer;
  background:var(--chip);color:var(--ink);text-align:center;text-decoration:none;display:block}
.btn.main{background:var(--accent);color:var(--accent-ink)}
.btn.wide{grid-column:1/-1}
.btn:disabled{opacity:.5}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:26px}
.stat small{color:var(--muted);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:8px 4px;border-top:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:500;font-size:13px;border-top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.short td{color:var(--warn);font-weight:600}
pre{white-space:pre-wrap;font:inherit;margin:0}
input,select{width:100%;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--line);
  background:var(--bg);color:var(--ink);margin-bottom:8px}
.code{font:700 34px/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:3px;text-align:center;
  padding:18px;border-radius:16px;background:var(--chip);margin:14px 0;user-select:all}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;z-index:9;max-width:90vw;
  opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.row{display:flex;align-items:center;gap:10px}
.row .grow{flex:1}
.muted{color:var(--muted);font-size:14px}
details summary{cursor:pointer;font-weight:600;list-style:none}
details summary::-webkit-details-marker{display:none}
.spin{opacity:.6}
nav[hidden]{display:none}
.tap{cursor:pointer}
.tap:active{background:var(--chip)}
tr.tap td:last-child::after{content:" ›";color:var(--muted)}
.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.big{font-size:18px;padding:18px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:20px 20px 0 0;
  padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h3{margin:0 0 4px;font-size:19px}
.sheet .muted{margin-bottom:12px}
.stepper{display:grid;grid-template-columns:64px 1fr 64px;gap:8px;margin:10px 0}
.stepper input{text-align:center;font-size:24px;font-weight:700;margin:0}
.stepper .btn{font-size:24px;padding:10px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.seg button{flex:1 1 auto;min-width:64px;border:1px solid var(--line);background:var(--bg);color:var(--ink);
  border-radius:10px;padding:10px 6px;font:inherit;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
label.l{display:block;font-size:13px;color:var(--muted);margin:6px 2px 4px}
table.dl td{vertical-align:top}
table.dl td:nth-child(2){white-space:nowrap;font-size:14px}
table.dl td:first-child{word-break:break-word}
table.dl .pl{font-weight:600}
table.ot td{font-size:14px}
table.bt td,table.bt th{font-size:13px;padding:6px 4px;white-space:nowrap}
table.bf td{padding:6px 4px;vertical-align:middle}
table.bf input{margin:0;padding:10px;text-align:center;font-size:18px}
table.ot td:first-child{white-space:nowrap;word-break:normal}
.seg button{min-width:0;white-space:nowrap}
table.ot td:nth-child(2){white-space:normal}
table.ot td:nth-child(3){white-space:nowrap}
table.dl .ch{color:var(--muted);font-size:13px}
tr.short .ch{color:inherit}
.result{white-space:pre-wrap;background:var(--ok-bg);border-radius:12px;padding:12px;margin-top:10px}
.badge:empty{display:none}
/* ---------- заказы менеджера, как в кабинете Маркета */
.ob-sw{display:grid;grid-template-columns:1fr 1fr;background:var(--chip);border-radius:16px;padding:4px;margin-bottom:6px}
.ob-sw button{border:0;background:none;padding:11px 6px;border-radius:12px;font:inherit;font-size:17px;font-weight:600;color:var(--muted);cursor:pointer}
.ob-sw button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.ob-tabs{display:flex;gap:20px;overflow-x:auto;border-bottom:1px solid var(--line);margin:0 -16px 12px;padding:0 16px;scrollbar-width:none}
.ob-tabs::-webkit-scrollbar{display:none}
.ob-tabs button{flex:none;border:0;background:none;font:inherit;font-size:16px;font-weight:600;color:var(--ink);
  padding:12px 0 10px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.ob-tabs button small{color:var(--muted);font-weight:400;font-size:16px;margin-left:5px}
.ob-tabs button.on{border-bottom-color:var(--ink)}
.ob-tabs button.warn small{color:var(--warn);font-weight:700}
.ob-q{position:relative;margin-bottom:6px}
.ob-q input{padding-left:40px;border-radius:14px;background:var(--chip);border-color:transparent;margin:0}
.ob-q:before{content:"⌕";position:absolute;left:14px;top:50%;transform:translateY(-52%);font-size:22px;color:var(--muted)}
.ob-sum{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin:10px 4px 8px}
.oc{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;padding:14px}
.oc .no{color:var(--accent);font-weight:600;font-size:16px;word-break:break-all}
.oc .nm{font-weight:700;font-size:16px;margin-top:2px}
.oc .art{color:var(--muted);font-size:14px;margin-top:2px}
.oc .kv{grid-column:1/-1;display:grid;grid-template-columns:96px 1fr;margin-top:8px;font-size:15px}
.oc .kv div{padding:9px 0;border-top:1px solid var(--line)}
.oc .kv div:nth-child(odd){color:var(--muted)}
.oc .kv small{display:block;color:var(--muted);font-size:13px}
.plate{width:52px;height:66px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-weight:800;font-size:18px;line-height:1.1;flex:none;position:relative}
.plate small{font-size:10px;font-weight:600;opacity:.75;letter-spacing:.2px}
.plate.black{background:#262626;color:#f3f3f3;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .ob-sw button.on{background:#3a433e} :root:not([data-theme="light"]) .plate.black{background:#0b0d0c} }
:root[data-theme="dark"] .ob-sw button.on{background:#3a433e} :root[data-theme="dark"] .plate.black{background:#0b0d0c}
.plate.white{background:#ffffff;color:#262626;border:1px solid #d8d4cc}
.plate.none{background:var(--chip);color:var(--muted)}
.plate i{position:absolute;right:-6px;top:-6px;background:var(--accent);color:var(--accent-ink);font-style:normal;font-size:11px;
  min-width:20px;height:20px;line-height:20px;border-radius:10px;text-align:center;padding:0 4px}
.plates{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 10px}
.plates .plate{width:44px;height:56px;font-size:15px}
.st{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:15px;margin-top:4px}
.st:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.st.today:before{background:var(--accent)}
.st.late{color:var(--warn)} .st.late:before{background:var(--warn)}
.st.done:before{background:var(--accent)}
.st.cancel:before{background:#c0392b}
.sh .hd{font-weight:700;font-size:17px}
.sh .ft{display:flex;align-items:center;font-weight:600}
.sh .ft span{flex:1}
/* ---------- личные сообщения */
/* шапка чата прилипает под верхней панелью и не уезжает при прокрутке */
.chat-top{position:sticky;top:var(--hdr, 56px);z-index:4;background:var(--bg);margin:-8px -16px 8px;padding:8px 16px}
body.xmas .chat-top{margin-top:-22px;padding-top:20px}
.chat-top .ob-sw{margin-bottom:0}
.chat-top .dm-head{margin-bottom:0}
.on-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#22c55e;margin-right:5px;vertical-align:1px}
#dm-status.online,.dm-st.online{color:#16a34a}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) #dm-status.online, :root:not([data-theme="light"]) .dm-st.online{color:#4ade80} }
:root[data-theme="dark"] #dm-status.online, :root[data-theme="dark"] .dm-st.online{color:#4ade80}
.dm-st{font-size:13px;color:var(--muted);margin:1px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dm-ava{position:relative}
.ava-on{position:absolute;right:0;bottom:0;width:12px;height:12px;border-radius:50%;background:#22c55e;border:2px solid var(--card)}
.chat-sw button{font-size:15px}
.dm-badge{display:inline-block;background:var(--warn);color:#fff;font-size:12px;font-weight:700;min-width:20px;height:20px;line-height:20px;
  border-radius:10px;padding:0 6px;text-align:center;margin-left:4px;vertical-align:1px}
.dm-badge:empty{display:none}
.dm-row{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:8px}
.dm-ava{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;
  justify-content:center;font-weight:700;font-size:19px;flex:none}
.dm-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dm-last{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.dm-last.new{color:var(--ink);font-weight:600}
.dm-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dm-head .btn{padding:10px 14px;flex:none}
.dm-head b{display:block;font-size:17px}
.dm-head small{color:var(--muted);font-size:13px}
.msg.pending{opacity:.65}
/* ---------- чат */
nav button{position:relative}
nav .dot{position:absolute;top:2px;left:calc(50% + 8px);background:var(--warn);color:#fff;font-size:11px;font-weight:700;
  min-width:18px;height:18px;line-height:18px;border-radius:9px;padding:0 5px}
nav .dot:empty{display:none}
body.chat main{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
.chat-list{display:flex;flex-direction:column;gap:4px}
.updbar{position:sticky;top:calc(56px + env(safe-area-inset-top));z-index:4;background:var(--accent);color:var(--accent-ink);
  padding:10px 16px;display:flex;align-items:center;gap:10px;font-size:14px}
.updbar .grow{flex:1;min-width:0}
.updbar b{display:block;font-size:15px}
.updbar small{display:block;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.updbar button,.updbar a{background:var(--accent-ink);color:var(--accent);border:0;border-radius:10px;padding:9px 14px;
  font:inherit;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}
.updbar button:disabled{opacity:.7}
.updbar .x{background:none;color:inherit;padding:4px 6px;font-size:20px;font-weight:400}
.chat-note{text-align:center;color:var(--muted);font-size:12px;margin:0 0 6px}
.chat-note:empty{display:none}
.chat-note a{color:var(--accent)}
.chat-day{align-self:center;background:var(--chip);color:var(--muted);font-size:12px;border-radius:999px;padding:3px 12px;margin:12px 0 6px}
.msg{max-width:82%;align-self:flex-start;background:var(--card);border:1px solid var(--line);
  border-radius:16px 16px 16px 4px;padding:8px 12px 6px}
.msg.mine{align-self:flex-end;background:var(--ok-bg);border-color:transparent;border-radius:16px 16px 4px 16px}
.msg .who{font-size:13px;font-weight:600;color:var(--accent);margin-bottom:2px}
.msg .who small{color:var(--muted);font-weight:400}
.msg .txt{white-space:pre-wrap;word-break:break-word}
.msg .tm{font-size:11px;color:var(--muted);text-align:right;margin-top:2px}
.msg.cont{margin-top:-1px}
.msg.cont .who{display:none}
.composer{position:fixed;left:0;right:0;z-index:4;bottom:calc(64px + env(safe-area-inset-bottom));
  background:var(--bg);border-top:1px solid var(--line);padding:8px 10px}
.composer .in{max-width:640px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;font:inherit;padding:11px 14px;border-radius:20px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);resize:none;max-height:120px;min-height:44px;line-height:1.35}
.msg a{color:var(--accent)}
nav.many button{font-size:10.5px}
nav.lots button{font-size:10px;padding:8px 0}
nav.lots button span{font-size:20px}
.reply-bar,.photo-bar{max-width:640px;margin:0 auto 8px;display:flex;align-items:center;gap:10px;background:var(--card);
  border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:8px 10px}
.reply-bar[hidden],.photo-bar[hidden]{display:none}
.reply-bar .grow,.photo-bar .grow{flex:1;min-width:0;font-size:14px}
.reply-bar b{color:var(--accent);display:block;font-size:13px}
.reply-bar span,.photo-bar span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.photo-bar img{width:52px;height:52px;object-fit:cover;border-radius:8px}
.xbtn,.composer button.xbtn{background:none;border:0;color:var(--muted);font-size:24px;cursor:pointer;width:auto;height:auto;padding:0 6px;border-radius:0}
.msg .q{border-left:3px solid var(--accent);background:rgba(127,127,127,.1);border-radius:6px;padding:4px 8px;margin:2px 0 6px;font-size:14px;cursor:pointer}
.msg .q b{display:block;color:var(--accent);font-size:13px}
.msg .q span{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.msg .ph{display:block;max-width:100%;width:240px;height:220px;object-fit:cover;border-radius:10px;margin:2px 0 4px;cursor:zoom-in;background:var(--chip)}
.msg .ph.bad{height:60px;object-fit:none}
.msg.flash{animation:flash 1.2s}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:none}}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:30;display:flex;align-items:center;justify-content:center}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
.viewer .xbtn{position:absolute;top:calc(10px + env(safe-area-inset-top));right:12px;color:#fff;font-size:30px}
.menu-msg{background:var(--bg);border-radius:12px;padding:10px 12px;margin-bottom:12px;max-height:120px;overflow:hidden;white-space:pre-wrap;color:var(--muted);font-size:14px}
.menu .btn{width:100%;margin-bottom:8px;text-align:left;padding:14px 16px}
.hrs{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.hrs:first-of-type{border-top:0}
.hrs .grow{flex:1;min-width:0}
.hrs .grow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrs input{width:78px;margin:0;text-align:center;font-size:20px;font-weight:700;padding:9px 4px}
.hrs input.has{border-color:var(--accent);background:var(--ok-bg)}
.hrs .fld{display:flex;flex-direction:column;align-items:center;gap:2px}
.hrs .fld small{font-size:11px;color:var(--muted)}
.hrs input.beds{width:64px}
.bonus{border-left:4px solid var(--warn)}
.bonus.ok{border-left-color:var(--accent)}
.bonus.no{border-left-color:var(--line);opacity:.75}
.bonus .amt{font-size:20px;font-weight:700;white-space:nowrap}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;background:var(--chip)}
.pill.wait{background:var(--warn-bg);color:var(--warn)}
.pill.ok{background:var(--ok-bg);color:var(--accent)}
.daybar{display:grid;grid-template-columns:52px 1fr 52px;gap:8px;align-items:center;margin-bottom:10px}
.daybar .btn{padding:12px 0;font-size:20px}

</head>
<body>
<header>
  <h1>Arkenstone</h1>
  <div class="who" id="who"></div>
  <button class="iconbtn" id="theme" aria-label="Тема" onclick="themeForm()" style="display:flex;align-items:center"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg></button>
  <button class="iconbtn" id="refresh" aria-label="Обновить">⟳</button>
</header>
<main id="main"><div class="empty">Загрузка…</div></main>
<nav id="nav" hidden></nav>
<div class="toast" id="toast"></div>

<script>
const TABS = {courier:["🚚","Курьер"], prod:["🏭","Производство"], keeper:["📦","Склад"], manager:["👔","Менеджер"],
  tech:["⏱","Табель"], reports:["📑","Отчёты"], chat:["💬","Чат"]};
const SHORT = {prod: "Цех", manager: "Менедж."};  // когда вкладок много, длинные названия не влезают
const ROLES = {courier:"Курьер", prod:"Производство", keeper:"Кладовщик", manager:"Менеджер",
  techdir:"Тех. директор", gendir:"Ген. директор", admin:"Администратор"};
let me = null, tab = null, timer = null;
let nav = 0;          // номер «перехода»: ответ, пришедший после ухода с экрана, выбрасываем
let onPage = false;   // открыта отдельная страница (Заказы, Остатки, Сотрудники…) — фоновое обновление её не трогает
/* Ссылка в карты без подъезда, домофона, этажа и квартиры — иначе поиск путается */
function mapUrl(addr){
  const clean = String(addr || "").split(",").map(x => x.trim())
    .filter(x => x && !/(подъезд|домофон|этаж|кв\.|квартир|офис|\bкв\b|под\.|код)/i.test(x)).join(", ");
  return "https://yandex.ru/maps/?text=" + encodeURIComponent(clean || addr);
}
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function token(){
  let t = null;
  try { t = localStorage.getItem("ark_token"); } catch(e) {}
  if (!t) {
    const b = new Uint8Array(32); crypto.getRandomValues(b);
    t = Array.from(b, x => x.toString(16).padStart(2,"0")).join("");
    try { localStorage.setItem("ark_token", t); } catch(e) {}
  }
  return t;
}
const TOKEN = token();

async function call(path, body){
  const r = await fetch(path, {method: body ? "POST" : "GET",
    headers: {"X-Token": TOKEN, "Content-Type": "application/json"},
    body: body ? JSON.stringify(body) : undefined});
  buildCheck(r.headers.get("X-App-Build"));
  let data = {};
  try { data = await r.json(); } catch(e) {}
  if (r.status === 403) { me = null; boot(); throw new Error(data.error || "Нет доступа"); }
  if (!r.ok) throw new Error(data.error || "Ошибка связи");
  if (!data || typeof data !== "object" || data.error) throw new Error((data && data.error) || "Нет связи с сервером, повторите");
  return data;
}

/* Автообновление: сервер в каждом ответе сообщает версию экранов. Бот обновили — версия другая, и приложение
   само перезагружается, как только это никому не помешает: не во время набора, не при открытом окне или форме. */
let BUILD = "__APP_BUILD__", _reloadT = null;
function buildCheck(v){
  if (!v) return;
  if (!BUILD || BUILD.startsWith("__")) { BUILD = v; return; }
  if (v !== BUILD && !_reloadT) reloadWhenSafe();
}
function reloadSafe(){
  if (document.hidden) return true;  // свёрнуто — человек ничего не заметит
  const a = document.activeElement;
  if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return false;   // что-то набирают
  if (document.querySelector(".sheet-bg")) return false;              // открыто окно снизу
  if (document.querySelector("#re-list")) return false;               // правка отчёта
  if (typeof techDirty === "function" && techDirty()) return false;   // несохранённые часы
  const ci = document.getElementById("chat-in"); if (ci && ci.value.trim()) return false;
  if (typeof chat !== "undefined" && (chat.pending || []).length) return false;   // сообщение ещё отправляется
  if (document.querySelector(".open-form input:not([type=search])")?.value) return false;  // заполняют форму
  return true;
}
function reloadWhenSafe(){
  clearTimeout(_reloadT);
  if (reloadSafe()) {
    try { sessionStorage.setItem("ark_reloaded", "1"); } catch(e) {}
    location.reload();
    return;
  }
  _reloadT = setTimeout(reloadWhenSafe, 3000);
}
document.addEventListener("visibilitychange", () => { if (_reloadT) reloadWhenSafe(); });
setTimeout(() => {
  let was = null; try { was = sessionStorage.getItem("ark_reloaded"); sessionStorage.removeItem("ark_reloaded"); } catch(e) {}
  if (was) toast("🔄 Приложение обновилось");
}, 900);

function toast(text){
  const t = $("#toast"); t.textContent = text; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2600);
}

async function boot(){
  try {
    me = await call("/api/me");
  } catch(e) {
    $("#main").innerHTML = `<div class="empty">Нет связи с сервером.<br><br><button class="btn" onclick="boot()">Повторить</button></div>`;
    return;
  }
  if (!me.ok) return showCode();
  $("#who").textContent = (me.name ? me.name + " · " : "") + me.label;
  const nav = $("#nav");
  nav.hidden = me.tabs.length < 2;
  const many = me.tabs.length > 5; nav.classList.toggle("many", many); nav.classList.toggle("lots", me.tabs.length > 6);
  nav.innerHTML = me.tabs.map(k => `<button data-tab="${k}"><span>${TABS[k][0]}</span>${many && (k === "prod" || me.tabs.length > 6) && SHORT[k] || TABS[k][1]}${k === "chat" ? `<b class="dot" id="chatdot"></b>` : ""}</button>`).join("");
  nav.querySelectorAll("button").forEach(b => b.onclick = () => open(b.dataset.tab));
  let saved = null; try { saved = localStorage.getItem("ark_tab"); } catch(e) {}
  // нажали на уведомление — APK открывает адрес с #tab=chat и т.п.
  const want = (location.hash.match(/tab=(\w+)/) || [])[1];
  if (want) try { history.replaceState(null, "", location.pathname); } catch(e) {}
  open(me.tabs.includes(want) ? want : me.tabs.includes(saved) ? saved : me.tabs[0]);
  chatPoll();
  nativeSetup();
  checkUpdate();
}

function showCode(){
  $("#nav").hidden = true; $("#who").textContent = "";
  $("#main").innerHTML = `
    <div class="card">
      <div class="title">Добро пожаловать</div>
      <p class="muted">Это рабочее приложение компании. Отправьте этот код менеджеру — он добавит вас, и откроется ваш экран.</p>
      <div class="code">${esc(me.code)}</div>
      <div class="actions">
        <button class="btn" id="copy">Скопировать</button>
        <button class="btn" id="share">Отправить</button>
        <button class="btn main wide" id="check">Проверить доступ</button>
      </div>
    </div>`;
  $("#copy").onclick = async () => { try { await navigator.clipboard.writeText(me.code); toast("Код скопирован"); } catch(e) { toast("Не вышло, перепишите код вручную"); } };
  $("#share").onclick = async () => {
    const text = `Мой код для приложения Arkenstone: ${me.code}`;
    if (navigator.share) { try { await navigator.share({text}); } catch(e) {} }
    else { try { await navigator.clipboard.writeText(text); toast("Текст скопирован"); } catch(e) {} }
  };
  $("#check").onclick = () => { toast("Проверяю…"); boot(); };
}

function open(k){
  chatMarkSeen();  // уходим из чата (или возвращаемся в него) — увиденное больше не считается непрочитанным
  tab = k; try { localStorage.setItem("ark_tab", k); } catch(e) {}
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === k));
  document.body.classList.toggle("chat", k === "chat");
  document.body.classList.remove("emoji");
  document.querySelectorAll(".composer").forEach(e => e.remove());
  $("#main").style.paddingBottom = "";
  if (k !== "chat" && chat !== CHAT_ALL) { clearTimeout(chat.timer); chat = CHAT_ALL; }
  chatView = "feed"; clearTimeout(window._dmListT);
  if (k === "chat") return chatOpen();
  chatBadge();
  setTimeout(() => chatPoll(CHAT_ALL), 300);  // вне чата тоже ждём новое — ради значка на вкладке «Чат»
  load(true);
}

const NEED = {courier: "days", prod: "stock", keeper: "raw", manager: "devices", tech: "workers", reports: "reports"};  // по этому полю узнаём «свой» ответ

/* Последний ответ по каждому экрану: при переключении вкладок сразу рисуем его, а свежий подставляем,
   когда придёт (и только если что-то поменялось — чтобы не сбивать прокрутку). */
const shown = {};
const DRAW = () => ({courier: drawCourier, prod: drawProd, keeper: drawKeeper, manager: drawManager, tech: drawTech, reports: drawReports});
async function load(fromTab){
  clearInterval(timer);
  onPage = false; window._pageAgain = null;
  const my = ++nav, t = tab, url = t === "tech" ? "/api/tech?day=" + techDay() : "/api/" + t;
  $("#refresh").classList.add("spin");
  const prev = shown[url];
  let early = false;
  // старое показываем только при переключении вкладок; после нажатия кнопки ждём свежее, чтобы не мелькало прежнее
  if (fromTab === true && prev && Date.now() - prev.at < 300000) {
    try { DRAW()[t](prev.data); early = true; } catch(e) {}
  }
  try {
    const data = await call(url);
    if (my !== nav || t !== tab) return;  // пока ждали, человек уже открыл другой экран
    if (!(NEED[t] in data)) throw new Error("Не получилось загрузить, повторите");
    const json = JSON.stringify(data);
    shown[url] = {data, json, at: Date.now()};
    const typing = document.querySelector("#main input:focus, #main textarea:focus, #main select:focus");
    if (!(early && prev.json === json) && !(early && typing)) DRAW()[t](data);
  } catch(e) {
    if (me && my === nav) {
      if (early) toast("Нет связи, показаны последние данные");
      else $("#main").innerHTML = `<div class="empty">${esc(e.message)}<br><br><button class="btn" onclick="load()">Повторить</button></div>`;
    }
  } finally {
    if (my === nav) {
      $("#refresh").classList.remove("spin");
      timer = setInterval(quietRefresh, 60000);
    }
  }
}
/* Фоновое обновление: не трогаем открытую страницу, окошко или форму, в которую что-то вводят */
function quietRefresh(){
  if (document.hidden) return;  // свёрнуто — не дёргаем сервер (и не держим статус «в сети»)
  if (tab === "chat") return chatPoll();
  if (onPage || document.querySelector(".open-form, .sheet-bg")) return;
  load();
}
$("#refresh").onclick = () => !(me && me.ok) ? boot() : tab === "chat" ? chatOpen() : (onPage && window._pageAgain ? window._pageAgain() : load());
document.addEventListener("visibilitychange", () => {
  if (!(me && me.ok)) return;
  if (document.hidden) {  // свернули — собеседники сразу увидят «не в сети»
    try { fetch("/api/away", {method: "POST", keepalive: true, headers: {"X-Token": TOKEN}}); } catch(e) {}
    return;
  }
  quietRefresh();
  if (tab !== "chat") chatPoll();  // вернулись в приложение — сразу узнаём, что пришло, пока было свёрнуто
});

/* ------------------------------ тема: как в телефоне / светлая / тёмная (запоминается на этом телефоне) */
function themeSet(t){
  try { t === "auto" ? localStorage.removeItem("ark_theme") : localStorage.setItem("ark_theme", t); } catch(e) {}
  if (t === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t;
  document.querySelectorAll("#th-seg button").forEach(b => b.classList.toggle("on", b.dataset.k === t));
}
function themeForm(){
  let t = "auto"; try { t = localStorage.getItem("ark_theme") || "auto"; } catch(e) {}
  const x = xmasOn();
  sheet(`<h3>Тема приложения</h3><div class="muted">Выбор запоминается на этом телефоне.</div>
    <div class="seg" id="th-seg">${Object.entries({auto: "Как в телефоне", light: "Светлая", dark: "Тёмная"}).map(([k, v]) =>
      `<button data-k="${k}" class="${k === t ? "on" : ""}" onclick="themeSet('${k}')">${v}</button>`).join("")}</div>
    <label class="l">🎄 Новогодняя гирлянда</label>
    <div class="seg" id="xm-seg"><button data-k="1" class="${x ? "on" : ""}" onclick="xmasSet(true)">Включена</button>
      <button data-k="0" class="${x ? "" : "on"}" onclick="xmasSet(false)">Выключена</button></div>
    <button class="btn" style="width:100%" onclick="closeSheet()">Готово</button>`);
}

/* ------------------------------ новогодняя гирлянда: огоньки по краю шапки и шарики.
   Сама включается с ноября по январь; выбор человека («Включена / Выключена») запоминается на телефоне */
function xmasOn(){
  let v = null; try { v = localStorage.getItem("ark_xmas"); } catch(e) {}
  if (v === "1" || v === "0") return v === "1";
  const m = new Date().getMonth();
  return m === 10 || m === 11 || m === 0;
}
function xmasSet(on){
  try { localStorage.setItem("ark_xmas", on ? "1" : "0"); } catch(e) {}
  document.querySelectorAll("#xm-seg button").forEach(b => b.classList.toggle("on", b.dataset.k === (on ? "1" : "0")));
  xmasDraw();
}
function hdrVar(){  // высота верхней панели — под ней «прилипает» переключатель чата
  const h = document.querySelector("header"); if (!h) return;
  document.documentElement.style.setProperty("--hdr", h.offsetHeight + "px");
}
function xmasDraw(){
  const h = document.querySelector("header"); if (!h) return;
  h.querySelector(".xmas-svg")?.remove();
  h.classList.toggle("xmas", xmasOn());
  document.body.classList.toggle("xmas", xmasOn());
  hdrVar();
  if (!xmasOn()) return;
  const W = h.clientWidth, step = 34, n = Math.max(4, Math.round(W / step)), dx = W / n;
  const colors = ["#ff4d4d", "#ffd23f", "#4ade80", "#4fa3ff", "#ff7ad9"];
  let wire = `M 0 6`, bulbs = "";
  for (let i = 0; i < n; i++) {
    const x0 = i * dx, x1 = x0 + dx, xm = x0 + dx / 2;
    wire += ` Q ${xm.toFixed(1)} 16 ${x1.toFixed(1)} 6`;
    const c = colors[i % colors.length], bx = xm, by = 11;  // лампочка висит в провисе провода
    bulbs += `<g class="bulb" style="color:${c};animation-delay:${((i * 0.37) % 1.6).toFixed(2)}s">
      <rect x="${(bx - 2.2).toFixed(1)}" y="${by - 1}" width="4.4" height="3" rx="1" fill="#2b2b2b"/>
      <ellipse cx="${bx.toFixed(1)}" cy="${by + 6}" rx="3.6" ry="5.2" fill="currentColor"/>
      <ellipse cx="${(bx - 1.2).toFixed(1)}" cy="${by + 4.2}" rx="1" ry="1.6" fill="#fff" opacity=".6"/></g>`;
  }
  // шарики висят на ниточках в нескольких местах гирлянды
  const ballAt = [0.18, 0.5, 0.82].map(f => Math.round(f * n - 0.5) * dx + dx);  // на стыках провода
  const ballColors = ["#d62828", "#e9b10a", "#2a9d8f"];
  const balls = ballAt.map((x, k) => `<g class="ball" style="animation-delay:${k * -1.1}s">
      <line x1="${x.toFixed(1)}" y1="6" x2="${x.toFixed(1)}" y2="17" stroke="#c9c9c9" stroke-width="1"/>
      <rect x="${(x - 2.6).toFixed(1)}" y="16" width="5.2" height="3.4" rx="1" fill="#d4af37"/>
      <circle cx="${x.toFixed(1)}" cy="27" r="8.5" fill="${ballColors[k % 3]}"/>
      <path d="M ${(x - 8).toFixed(1)} 26 Q ${x.toFixed(1)} 30 ${(x + 8).toFixed(1)} 26" stroke="#fff" stroke-opacity=".45" stroke-width="1.4" fill="none"/>
      <circle cx="${(x - 3).toFixed(1)}" cy="23.5" r="2.2" fill="#fff" opacity=".55"/></g>`).join("");
  h.insertAdjacentHTML("beforeend", `<svg class="xmas-svg" aria-hidden="true" viewBox="0 0 ${W} 40" width="${W}" height="40">
    <path d="${wire}" fill="none" stroke="#3d5246" stroke-width="1.6"/>${bulbs}${balls}</svg>`);
}
xmasDraw();
let _xmT; window.addEventListener("resize", () => { clearTimeout(_xmT); _xmT = setTimeout(xmasDraw, 200); });
if (window.ResizeObserver) new ResizeObserver(hdrVar).observe(document.querySelector("header"));

/* ------------------------------ окно-форма снизу */
function sheet(html){
  closeSheet();
  document.body.insertAdjacentHTML("beforeend", `<div class="sheet-bg" onclick="if(event.target===this)closeSheet()"><div class="sheet">${html}</div></div>`);
  return document.querySelector(".sheet");
}
function closeSheet(){ document.querySelectorAll(".sheet-bg").forEach(e => e.remove()); }
function stepper(id, val){
  return `<div class="stepper"><button class="btn" onclick="step('${id}',-1)">−</button>
    <input id="${id}" type="number" inputmode="decimal" min="0" value="${val}"><button class="btn" onclick="step('${id}',1)">+</button></div>`;
}
function step(id, d){ const i = document.getElementById(id); i.value = Math.max(0, (parseFloat(i.value.replace(",", ".")) || 0) + d); }
function seg(id, opts, on){
  return `<div class="seg" id="${id}" data-v="${esc(on)}">${Object.entries(opts).map(([k,v]) =>
    `<button class="${k===on?"on":""}" data-k="${esc(k)}" onclick="pick(this)">${esc(v)}</button>`).join("")}</div>`;
}
function pick(b){ const g = b.parentNode; g.dataset.v = b.dataset.k; g.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); }
async function act(btn, path, body, keepOpen){
  btn.disabled = true;
  try {
    const r = await call(path, body);
    if (keepOpen) { const box = btn.closest(".sheet"); box.querySelector(".result")?.remove();
      box.insertAdjacentHTML("beforeend", `<div class="result">${esc(r.message)}</div>`); btn.disabled = false;
      box.querySelector(".result").scrollIntoView({behavior: "smooth", block: "end"}); }
    else { closeSheet(); toast(r.message.split("\n")[0]); }
    load();
  } catch(e) { toast(e.message); btn.disabled = false; }
}
const num = id => parseFloat(String(document.getElementById(id).value).replace(",", ".")) || 0;

/* ------------------------------ курьер */
function drawCourier(d){
  window._ret = d.returns; window._days = d.days;
  let h = d.pay ? `<div class="toolbar"><button class="btn" onclick="returnForm()">↩️ Возврат</button>
    <button class="btn" onclick="payView()">💰 Расчёт</button></div>`
    : `<button class="btn" style="width:100%;margin-bottom:6px" onclick="returnForm()">↩️ Возврат</button>`;
  d.days.forEach((day, di) => {
    const table = day.rows.length ? `<table class="dl">
      <tr><th>Куда</th><th>Кровать</th><th class="n">Шт</th></tr>
      ${day.rows.map((r, ri) => `<tr class="tap ${r.late ? "short" : ""}" onclick="deliveryView(${di},${ri})">
        <td><div class="pl">${esc(r.place)}</div><div class="ch">${esc(r.channel)}${r.late ? " · просрочен" : ""}</div></td>
        <td>${r.beds.map(esc).join("<br>")}</td><td class="n">${r.qty}</td></tr>`).join("")}
      </table>` : `<div class="muted" style="text-align:center;padding:8px">${day.today ? "Доставок нет 🎉" : "Доставок пока нет"}</div>`;
    if (day.today) h += `<h2>${day.label} · ${day.date}</h2><div class="card">${table}</div>`;
    else h += `<details class="card" style="margin-top:12px"><summary class="row"><span class="grow title">📅 ${day.label} · ${day.date}</span>
      <span class="badge">${day.qty} шт. ▾</span></summary><div style="margin-top:8px">${table}</div></details>`;
  });
  $("#main").innerHTML = h;
}

function deliveryView(di, ri){
  const day = window._days[di], r = day.rows[ri];
  window._cur = r;
  const t = new Date(); t.setDate(t.getDate() + 1);
  const min = t.toISOString().slice(0,10);
  sheet(`<h3>${esc(r.place)}</h3><div class="muted">${esc(r.channel)} · ${day.label.toLowerCase()} ${day.date}${r.late ? " · просрочен" : ""}</div>
    <table><tr><th>Кровать</th></tr>${r.beds.map(b => `<tr><td>${esc(b)}</td></tr>`).join("")}</table>
    <div class="muted" style="margin-top:8px">Заказ${r.orders.length > 1 ? "ы" : ""}: ${r.orders.map(esc).join(", ")}${r.phone ? `<br>Телефон: ${esc(r.phone)}` : ""}</div>
    <div class="actions">
      ${r.tel ? `<a class="btn" href="tel:${esc(r.tel)}">📞 Позвонить</a>` : ""}
      ${r.address ? `<a class="btn" target="_blank" href="${esc(mapUrl(r.address))}">🗺 Карта</a>` : ""}
      ${day.today ? `<button class="btn main wide" onclick="doneCur(this)">✅ Доставлен</button>
      <div class="wide" style="grid-column:1/-1"><label class="l">Перенести на дату</label>
        <input id="mv-date" type="date" min="${min}" value="${min}">
        <button class="btn" style="width:100%" onclick="moveCur(this)">📅 Перенести</button></div>`
      : r.kind === "city" ? `<button class="btn main wide" onclick="doneCur(this, true)">✅ Доставлен раньше срока</button>` : ""}
    </div>`);
}

async function doneCur(btn, early){
  if (!confirm(early ? "Срок доставки ещё не наступил. Отметить как доставленный сегодня?" : "Отметить как доставленный?")) return;
  await act(btn, "/api/courier/done", {kind: window._cur.kind, key: window._cur.key});
}

async function moveCur(btn){
  await act(btn, "/api/courier/move", {kind: window._cur.kind, key: window._cur.key, date: document.getElementById("mv-date").value});
}

function returnForm(){
  const r = window._ret;
  const codes = Object.fromEntries(r.codes.map(c => [c.code, c.name.replace("/30 ", " ")]));
  sheet(`<h3>↩️ Возврат</h3><div class="muted">Кровать сразу добавится в остатки склада и в расчёт.</div>
    <label class="l">Площадка</label>${seg("r-kind", r.kinds, "ya")}
    <label class="l">Кровать</label>${seg("r-code", codes, r.codes[0].code)}
    <label class="l">Ножки</label>${seg("r-legs", {"25":"25","30":"30","35":"35"}, "30")}
    <label class="l">Сколько</label>${stepper("r-qty", 1)}
    <button class="btn main big" style="width:100%" onclick="act(this,'/api/courier/return',{kind:document.getElementById('r-kind').dataset.v,
      code:document.getElementById('r-code').dataset.v, legs:document.getElementById('r-legs').dataset.v, qty:num('r-qty')}, true)">Записать возврат</button>`);
}

async function payView(){
  const box = sheet(`<h3>💰 Расчёт доставок</h3><div class="muted">Загрузка…</div>`);
  try {
    const r = await call("/api/courier/pay");
    box.innerHTML = `<h3>💰 Расчёт доставок</h3><pre style="margin:10px 0">${esc(r.text)}</pre>` +
      (r.url ? `<a class="btn" target="_blank" href="${esc(r.url)}">📊 Открыть таблицу</a>` : "");
  } catch(e) { box.querySelector(".muted").textContent = e.message; }
}

/* ------------------------------ производство */
/* Производство делится на три цеха; выбор запоминается на телефоне */
const SHOPS = {weld:["🔥","Сварочный цех","сваренные каркасы и что сварить"],
               paint:["🎨","Малярный цех","окрашенные кровати и чего не хватает"],
               blanks:["🪚","Заготовочный цех","заготовки и на сколько кроватей хватает"]};
function shop(k){ try { k ? localStorage.setItem("ark_shop", k) : localStorage.removeItem("ark_shop"); } catch(e) {} drawProd(window._prod); window.scrollTo(0,0); }

function drawProd(d){
  window._prod = d;
  let k = null; try { k = localStorage.getItem("ark_shop"); } catch(e) {}
  if (!SHOPS[k]) return drawShops(d);
  const back = `<button class="btn" style="margin-bottom:10px" onclick="shop()">← Цеха</button><h2 style="margin-top:0">${SHOPS[k][0]} ${SHOPS[k][1]}</h2>`;
  $("#main").innerHTML = back + ({weld: drawWeld, paint: drawPaint, blanks: drawBlanks})[k](d);
}

function drawShops(d){
  $("#main").innerHTML = `
    ${d.today ? `<button class="btn main big" style="width:100%;margin-bottom:10px" onclick="shippedForm()">✅ Кровати отгружены · ${d.today} шт.</button>`
      : `<div class="card muted" style="text-align:center">${d.shipped ? `Сегодня отгружено ${d.shipped} шт. ✅` : "На сегодня отгрузок нет"}</div>`}
    <h2>Выберите цех</h2>
    ${Object.entries(SHOPS).map(([k, v]) => `<div class="card tap row" onclick="shop('${k}')">
      <span style="font-size:30px">${v[0]}</span><div class="grow"><div class="title">${v[1]}</div><div class="sub">${v[2]}</div></div><span class="muted">›</span></div>`).join("")}
    <details class="card" style="margin-top:22px"><summary class="row"><span class="grow title">📋 План производства</span><span class="badge">${(d.plan.match(/Всего: (\d+)/) || [,"0"])[1]} шт. ▾</span></summary>
      <pre style="margin-top:12px">${esc(d.plan.split("\n").slice(2).join("\n"))}</pre></details>`;
}

function drawWeld(d){
  const todo = d.weld.reduce((a, w) => a + w.todo, 0);
  const en = Object.fromEntries((d.blanks.enough || []).map(e => [e.width, e.n]));
  return `
    <button class="btn main big" style="width:100%;margin-bottom:6px" onclick="frameForm()">🔩 Внести сваренные каркасы</button>
    <h2>Нужно сварить · ${todo} шт.</h2>
    <div class="card" style="padding:6px 10px"><table>
      <tr><th>Размер</th><th class="n">Сварено</th><th class="n">Сварить</th>${d.blanks.ok ? `<th class="n">Загот.</th>` : ""}</tr>
      ${d.weld.map((w, i) => `<tr class="tap ${w.todo ? "short" : ""}" onclick="frameForm(${i})"><td>${w.width}</td>
        <td class="n">${w.frames}</td><td class="n">${w.todo || ""}</td>${d.blanks.ok ? `<td class="n">${en[w.width] ?? "—"}</td>` : ""}</tr>`).join("")}
    </table></div>
    ${legsBlock(d.legs, "welded", "Сваренные ножки · штучно", "🦵 Внести сваренные ножки")}
    <div class="muted" style="margin:6px 4px">«Сварить» = нужно по заказам − уже покрашено − уже сварено. «Загот.» — на сколько каркасов хватает заготовок.
    Сваренный каркас сам списывает заготовки: ${Object.entries(d.blanks.bom || {}).map(([n, k]) => `${n.toLowerCase()} ×${k}`).join(", ")}.</div>`;
}

function legsForm(i, kind){
  kind = kind || "welded";
  const painted = kind === "painted";
  const L = painted ? window._prod.legs_painted : window._prod.legs;
  const opts = Object.fromEntries(L.map(l => [String(l.height), painted ? `${l.height}` : `${l.height} · ${l.n} шт.`]));
  const h = `+document.getElementById('l-h').dataset.v`;
  const col = painted ? `,color:document.getElementById('l-c').dataset.v` : "";
  const title = painted ? "🎨 Окрашенные ножки" : "🦵 Сваренные ножки";
  const hint = painted ? "Выберите высоту, цвет и сколько покрасили. Столько же спишется из сваренных ножек."
                       : "Выберите высоту и сколько штук сварили. Ошиблись — «Убрать».";
  sheet(`<h3>${title}</h3><div class="muted">${hint}</div>
    <label class="l">Высота</label>${seg("l-h", opts, String((L[i ?? 0] || L[0]).height))}
    ${painted ? `<label class="l">Цвет</label>${seg("l-c", {black: "Чёрные", white: "Белые"}, "black")}` : ""}
    <label class="l">Сколько штук</label>${stepper("l-n", 5)}
    <div class="actions"><button class="btn" onclick="act(this,'/api/prod/legs',{kind:'${kind}',height:${h}${col},delta:-num('l-n')})">− Убрать</button>
    <button class="btn main" onclick="act(this,'/api/prod/legs',{kind:'${kind}',height:${h}${col},delta:num('l-n')})">+ Добавить</button></div>`);
}

function legsBlock(list, kind, title, btn){
  const painted = kind === "painted";
  const head = painted ? `<tr><th>Высота</th><th class="n">Чёрные</th><th class="n">Белые</th></tr>` : `<tr><th>Высота</th><th class="n">Есть, шт.</th></tr>`;
  const cells = l => painted ? `<td class="n">${l.black ?? 0}</td><td class="n">${l.white ?? 0}</td>` : `<td class="n">${l.n}</td>`;
  return `<h2>${title}</h2>` + (list.length ? `<div class="card" style="padding:6px 10px"><table>${head}
    ${list.map((l, i) => `<tr class="tap" onclick="legsForm(${i},'${kind}')"><td>${l.height}</td>${cells(l)}</tr>`).join("")}</table>
    <button class="btn" style="width:100%;margin-top:8px" onclick="legsForm(0,'${kind}')">${btn}</button></div>`
    : `<div class="card muted">Нет блока «Размер ножки» на листе.</div>`);
}

function drawPaint(d){
  const rows = d.stock.map((x, i) => {
    const lack = Math.max(0, x.need - (x.have || 0));
    return `<tr class="tap ${lack ? "short" : ""}" onclick="stockForm(${i})"><td>${esc(x.name)}</td><td class="n">${x.have ?? "—"}</td><td class="n">${x.need || ""}</td><td class="n">${lack || ""}</td></tr>`;
  }).join("");
  const lack = d.stock.reduce((a, x) => a + Math.max(0, x.need - (x.have || 0)), 0);
  return `
    <button class="btn main big" style="width:100%;margin-bottom:6px" onclick="stockForm()">🎨 Внести окрашенные кровати</button>
    <h2>Окрашенные · не хватает ${lack} шт.</h2>
    <div class="card" style="padding:6px 10px"><table>
      <tr><th>Кровать</th><th class="n">Есть</th><th class="n">Нужно</th><th class="n">Не хват.</th></tr>${rows}</table></div>
    <div class="muted" style="margin:6px 4px">Добавленные кровати сами списываются со сваренных каркасов.</div>
    ${legsBlock(d.legs_painted || [], "painted", "Окрашенные ножки · штучно", "🎨 Внести окрашенные ножки")}`;
}

function shortText(e){
  if (!e.short) return "всего хватает";
  const parts = e.short.split(", ");
  return parts.length <= 2 ? e.short : `не хватает ${parts.length} видов деталей`;
}

function drawBlanks(d){
  const b = d.blanks;
  if (!b.ok) return `<div class="card muted">Не нашёл лист «Заготовки» в таблице.</div>`;
  return `
    <button class="btn main big" style="width:100%;margin-bottom:6px" onclick="blanksForm()">➕ Добавить / убрать заготовки</button>
    <h2>На сколько кроватей хватает</h2>
    <div class="card" style="padding:6px 10px"><table>
      <tr><th>Размер</th><th class="n">Хватает</th><th>Подробно</th></tr>
      ${b.enough.map(e => `<tr class="tap ${e.n ? "" : "short"}" onclick="blanksSize('${e.width}')"><td><b>${e.width}</b></td>
        <td class="n"><b>${e.n}</b></td><td style="font-size:13px">${esc(shortText(e))}</td></tr>`).join("")}
    </table></div>
    <div class="muted" style="margin:6px 4px">Нажмите на размер — откроется, каких деталей сколько есть и сколько не хватает.</div>
    <button class="btn" style="width:100%;margin-top:6px" onclick="blanksAll()">📦 Все остатки заготовок</button>`;
}

function blanksSize(w){
  const b = window._prod.blanks, parts = b.sizes[w], e = b.enough.find(x => String(x.width) === String(w));
  const rows = b.per.map(n => {
    const k = b.bom[n], have = parts[n] || 0, lack = k ? Math.max(0, k * (e.n + 1) - have) : 0;
    return `<tr class="${lack ? "short" : ""}"><td>${esc(n)}</td><td class="n">${have}</td><td class="n">${k || "—"}</td><td class="n">${lack || ""}</td></tr>`;
  }).join("");
  sheet(`<h3>🪚 Заготовки ${esc(w)}</h3><div class="muted">Хватает на <b>${e.n}</b> кров. «Не хватает» — сколько докупить/нарезать, чтобы собрать ещё одну.</div>
    <table><tr><th>Деталь</th><th class="n">Есть</th><th class="n">На 1</th><th class="n">Не хват.</th></tr>${rows}</table>
    <div class="actions"><button class="btn" onclick="closeSheet()">Закрыть</button>
    <button class="btn main" onclick="blanksForm('${esc(w)}')">➕ Внести</button></div>`);
}

function blanksAll(){
  const b = window._prod.blanks, sizes = Object.keys(b.sizes);
  page("Остатки заготовок", `
    <div class="card" style="padding:6px 10px;overflow-x:auto"><table class="bt"><tr><th>Деталь</th>${sizes.map(w => `<th class="n">${w}</th>`).join("")}</tr>
      ${b.per.map(n => `<tr><td>${esc(n)}</td>${sizes.map(w => `<td class="n">${b.sizes[w][n] || 0}</td>`).join("")}</tr>`).join("")}
      <tr><td><b>Хватает на</b></td>${sizes.map(w => `<td class="n"><b>${(b.enough.find(e => String(e.width) === w) || {}).n ?? 0}</b></td>`).join("")}</tr></table></div>
    ${b.common.length ? `<h2>Общие</h2><div class="card" style="padding:6px 10px"><table>${b.common.map(n => `<tr><td>${esc(n)}</td><td class="n">${b.common_qty[n] || 0}</td></tr>`).join("")}</table></div>` : ""}
    <button class="btn main" style="width:100%;margin-top:10px" onclick="blanksForm()">➕ Добавить / убрать заготовки</button>`);
}

function blanksForm(size){
  const b = window._prod.blanks;
  const sizes = Object.fromEntries([...Object.keys(b.sizes).map(w => [w, w]), ["common", "Общие"]]);
  size = size || Object.keys(b.sizes)[0];
  const names = size === "common" ? b.common : b.per;
  const have = n => size === "common" ? (b.common_qty[n] || 0) : (b.sizes[size][n] || 0);
  sheet(`<h3>🪚 Заготовки</h3><div class="muted">Выберите размер и впишите количество у нужных деталей.</div>
    <label class="l">Размер</label>${seg("b-size", sizes, size).replace(/onclick="pick\(this\)"/g, 'onclick="blanksForm(this.dataset.k)"')}
    <table class="bf">${names.map((n, i) => `<tr><td>${esc(n)}${b.bom[n] ? `<div class="ch">на кровать: ${b.bom[n]}</div>` : ""}</td>
      <td class="n muted">есть ${have(n)}</td>

/* Экран «Заказы» как в кабинете Маркета: сверху Город / По России, ниже вкладки по статусам.
   По России заказы склеены в отгрузки (дата · номер · N заказов), нажатие открывает заказы отгрузки. */
const OB_TABS = {today: "Сегодня", ahead: "Впереди", late: "Просрочены", done: "Доставлены", cancel: "Отмены"};
const OB_ST = {city: {today: "Доставка сегодня", ahead: "Ждёт доставки", late: "Просрочен", done: "Доставлен", cancel: "Отменён"},
               ru: {today: "Отгрузка сегодня", ahead: "Ждёт отгрузки", late: "Просрочена", done: "Доставлено", cancel: "Отменено"}};
function plural(n, one, few, many){
  const a = Math.abs(n) % 100, b = a % 10;
  return `${n} ${a > 10 && a < 20 ? many : b === 1 ? one : b >= 2 && b <= 4 ? few : many}`;
}
function obState(ch){
  let st = window._obs;
  if (!st) { try { st = JSON.parse(localStorage.getItem("ark_ob") || "null"); } catch(e) {} }
  st = Object.assign({kind: "city", tab: "today", q: ""}, st || {}, ch || {});
  window._obs = st;
  try { localStorage.setItem("ark_ob", JSON.stringify({kind: st.kind, tab: st.tab})); } catch(e) {}
  return st;
}
function niceDate(iso){
  if (!iso) return "";
  const [y, m, d] = iso.split("-").map(Number);
  return `${d} ${MONTHS[m - 1]}`;
}
function plateHtml(r, small){
  const cls = r.color || "none";
  return `<div class="plate ${cls}">${r.width || "?"}<small>${r.color === "black" ? "чёрн." : r.color === "white" ? "бел." : ""}</small>${r.qty > 1 ? `<i>×${r.qty}</i>` : ""}</div>`;
}
function obCard(r){
  const i = window._orders.rows.indexOf(r), kind = r.city ? "city" : "ru";
  const [ad, at] = (r.added || "").split(" ");
  const status = r.status && (r.tab === "done" || r.tab === "cancel") ? r.status : OB_ST[kind][r.tab];
  return `<div class="card tap oc" onclick="orderView(${i})">
    ${plateHtml(r)}
    <div><div class="no">№ ${esc(r.order_no)}</div>
      <div class="nm">Кровать ${esc(r.title)}${r.qty > 1 ? ` ×${r.qty}` : ""}</div>
      ${r.article ? `<div class="art">${esc(r.article)}</div>` : ""}</div>
    <div class="kv">
      <div>Создан</div><div>${esc(ad || "—")}${at ? `<small>${esc(at)}</small>` : ""}</div>
      <div>Отгрузка</div><div>${esc(r.ship || "—")}${r.shipment ? `<small>№ ${esc(r.shipment)}</small>` : ""}</div>
      <div>Доставка</div><div>${esc(r.delivery || "—")}${r.address ? `<small>${esc(r.address)}</small>` : ""}</div>
      <div>Статус</div><div><span class="st ${r.tab}" style="margin:0">${esc(status)}</span></div>
      <div>Площадка</div><div>${esc(r.channel || "—")}</div>
    </div></div>`;
}
function obGroups(rows){  // отгрузки по России: площадка + номер отгрузки + дата
  const map = new Map();
  rows.forEach(r => {
    const k = `${r.channel}|${r.shipment}|${r.sort}`;
    if (!map.has(k)) map.set(k, {key: k, channel: r.channel, shipment: r.shipment, sort: r.sort, tab: r.tab, rows: []});
    map.get(k).rows.push(r);
  });
  return [...map.values()];
}
function obShipCard(g, gi){
  const beds = g.rows.reduce((a, r) => a + r.qty, 0);
  const head = (g.sort ? niceDate(g.sort) : "Без даты") + (g.shipment ? ` · №${g.shipment}` : "");
  return `<div class="card tap sh" onclick="obShip(${gi})">
    <div class="hd">${esc(head)}</div>
    <div class="st ${g.tab}">${esc(OB_ST.ru[g.tab])} · ${esc(g.channel)}</div>
    <div class="plates">${g.rows.slice(0, 8).map(r => plateHtml(r, true)).join("")}${g.rows.length > 8 ? `<div class="plate none">+${g.rows.length - 8}</div>` : ""}</div>
    <div class="ft"><span>${plural(g.rows.length, "заказ", "заказа", "заказов")} · ${plural(beds, "кровать", "кровати", "кроватей")}</span><span class="muted" style="flex:none">›</span></div>
  </div>`;
}
async function ordersPage(fresh, ch){
  obState(ch);
  const my = ++nav;
  if (fresh !== false || !window._orders) {
    if (!window._orders) page("Заказы и отгрузки", `<div class="muted">Загрузка…</div>`, () => ordersPage(true));
    try { window._orders = await call("/api/manager/orders"); } catch(e) { return toast(e.message); }
    if (my !== nav) return;
  }
  const st = window._obs;
  page("Заказы и отгрузки", `
    <div class="ob-sw" id="ob-sw"></div>
    <div class="ob-tabs" id="ob-tabs"></div>
    <div class="ob-q"><input id="ob-q" type="search" placeholder="Номер заказа, артикул, адрес" value="${esc(st.q)}" autocomplete="off" enterkeyhint="search"></div>
    <div id="ob-body"></div>
    ${window._orders.url ? `<a class="btn" style="margin-top:12px" target="_blank" href="${esc(window._orders.url)}">Открыть в Google Таблице</a>` : ""}`,
    () => ordersPage(true));
  let tm;
  $("#ob-q").oninput = e => { clearTimeout(tm); tm = setTimeout(() => obGo({q: e.target.value}), 200); };
  obFill();
  if (window._obScroll != null) { window.scrollTo(0, window._obScroll); window._obScroll = null; }
}
function obGo(ch){  // переключили город/Россию, вкладку или набрали поиск: перерисовываем список, поле поиска не трогаем
  obState(ch);
  if (ch && "q" in ch && ch.q === "" && $("#ob-q")) $("#ob-q").value = "";
  obFill();
  if (ch && !("q" in ch && Object.keys(ch).length === 1)) window.scrollTo(0, 0);
}
function obFill(){
  const st = window._obs, d = window._orders;
  if (!$("#ob-body")) return;
  const kindRows = d.rows.filter(r => r.city === (st.kind === "city"));
  const q = st.q.trim().toLowerCase();
  const rows = q ? kindRows.filter(r => [r.order_no, r.article, r.address, r.shipment, r.title, r.phone].join(" ").toLowerCase().includes(q))
                 : kindRows.filter(r => r.tab === st.tab);
  if (st.tab === "done" || st.tab === "cancel") rows.sort((a, b) => (b.end || "").localeCompare(a.end || "") || b.id - a.id);
  const count = t => kindRows.filter(r => r.tab === t).length;
  const beds = rows.reduce((a, r) => a + r.qty, 0);
  const n = `${plural(rows.length, "заказ", "заказа", "заказов")} · ${plural(beds, "кровать", "кровати", "кроватей")}`;
  let list, sum;
  if (st.kind === "ru" && !q) {
    const groups = obGroups(rows);
    window._obg = groups;
    sum = `<span>${plural(groups.length, "отгрузка", "отгрузки", "отгрузок")}</span><span>${n}</span>`;
    list = groups.map(obShipCard).join("");
  } else {
    sum = `<span>${q ? "Найдено во всех вкладках" : ""}</span><span>${n}</span>`;
    list = rows.map(obCard).join("");
  }
  $("#ob-sw").innerHTML = `<button class="${st.kind === "city" ? "on" : ""}" onclick="obGo({kind:'city',q:''})">Город</button>
    <button class="${st.kind === "ru" ? "on" : ""}" onclick="obGo({kind:'ru',q:''})">По России</button>`;
  $("#ob-tabs").innerHTML = Object.entries(OB_TABS).map(([k, v]) => `<button class="${!q && k === st.tab ? "on" : ""} ${k === "late" && count(k) ? "warn" : ""}"
    onclick="obGo({tab:'${k}',q:''})">${v}<small>${count(k)}</small></button>`).join("");
  $("#ob-body").innerHTML = `<div class="ob-sum">${sum}</div>` + (list || `<div class="empty">${q ? "Ничего не нашлось" : "Здесь пока пусто"}</div>`);
  const on = document.querySelector(".ob-tabs button.on"); if (on) on.scrollIntoView({block: "nearest", inline: "center"});
}
function obShip(gi){
  const g = window._obg[gi]; if (!g) return;
  window._obScroll = window.scrollY;
  const beds = g.rows.reduce((a, r) => a + r.qty, 0);
  const head = (g.sort ? niceDate(g.sort) : "Без даты") + (g.shipment ? ` · №${g.shipment}` : "");
  page(esc(head), `<div class="st ${g.tab}" style="margin:-4px 4px 12px">${esc(OB_ST.ru[g.tab])} · ${esc(g.channel)} ·
      ${plural(g.rows.length, "заказ", "заказа", "заказов")} · ${plural(beds, "кровать", "кровати", "кроватей")}</div>
    ${g.rows.map(obCard).join("")}`, () => ordersPage(true), "ordersPage(false)");
  window.scrollTo(0, 0);
}

function orderView(i){
  const r = window._orders.rows[i];
  const kind = r.city ? "city" : "ru";
  const status = r.status && (r.tab === "done" || r.tab === "cancel") ? r.status : OB_ST[kind][r.tab];
  const where = r.city ? r.address : (r.shipment ? `Отгрузка № ${r.shipment}` : "");
  sheet(`<h3>№ ${esc(r.order_no)}</h3><div class="muted">${esc(r.channel)} · ${esc(status)}</div>
    <table><tr><td>Кровать</td><td>${esc(r.title)} ×${r.qty}</td></tr>

    ${where ? `<tr><td>${r.city ? "Адрес" : "Куда"}</td><td>${esc(where)}</td></tr>` : ""}
    ${r.ship ? `<tr><td>Отгрузка</td><td>${esc(r.ship)}</td></tr>` : ""}
    ${r.delivery ? `<tr><td>Доставка</td><td>${esc(r.delivery)}</td></tr>` : ""}
    ${r.phone ? `<tr><td>Телефон</td><td>${esc(r.phone)}</td></tr>` : ""}</table>
    <div class="actions">${r.tel ? `<a class="btn" href="tel:${esc(r.tel)}">📞 Позвонить</a>` : ""}
    ${r.city && r.address ? `<a class="btn" target="_blank" href="${esc(mapUrl(r.address))}">🗺 Карта</a>` : ""}
    ${r.city && ["today", "ahead", "late"].includes(r.tab) && me && me.tabs.includes("courier")
      ? `<button class="btn main wide" onclick="obDone(this, ${i})">✅ Доставлен${r.tab === "ahead" ? " раньше срока" : ""}</button>` : ""}</div>`);
}
/* «Доставлен» прямо из экрана «Заказы». Только город: заказы по России отмечаются день в день во вкладке «Курьер» */
async function obDone(btn, i){
  const r = window._orders.rows[i];
  if (!confirm(r.tab === "ahead" ? `Срок доставки ещё не наступил. Отметить № ${r.order_no} доставленным сегодня?`
                                 : `Отметить № ${r.order_no} доставленным?`)) return;
  btn.disabled = true;
  try {
    const res = await call("/api/courier/done", {kind: "city", key: r.order_no});
    closeSheet(); toast(res.message.split("\n")[0]);
    window._obScroll = window.scrollY;
    ordersPage(true);
  } catch(e) { toast(e.message); btn.disabled = false; }
}

async function stockPage(){
  const my = ++nav;
  page("Остатки", `<div class="muted">Загрузка…</div>`, stockPage);
  let d;
  try { d = await call("/api/prod"); } catch(e) { return toast(e.message); }
  if (my !== nav) return;

const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromIso = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const MONTHS = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const MONTHS1 = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const hh = h => String(Math.round((+h || 0) * 100) / 100).replace(".", ",");
function techDay(v){
  if (v) window._techDay = v;
  return window._techDay || iso(new Date());
}
function dayTitle(s){
  const d = fromIso(s), t = new Date(); t.setHours(0,0,0,0);
  const diff = Math.round((t - d) / 864e5);
  const w = d.toLocaleDateString("ru-RU", {weekday: "long"});
  return [`${d.getDate()} ${MONTHS[d.getMonth()]}`, diff === 0 ? "сегодня" : diff === 1 ? "вчера" : w];
}
function fmtPeriod(a, b){
  const x = fromIso(a), y = fromIso(b);
  if (a === b) return `${x.getDate()} ${MONTHS[x.getMonth()]} ${x.getFullYear()}`;
  if (x.getMonth() === y.getMonth() && x.getFullYear() === y.getFullYear())
    return `${x.getDate()}–${y.getDate()} ${MONTHS[x.getMonth()]} ${x.getFullYear()}`;
  return `${x.getDate()} ${MONTHS[x.getMonth()]} – ${y.getDate()} ${MONTHS[y.getMonth()]} ${y.getFullYear()}`;
}

function periodOf(k){
  const t = new Date(), y = t.getFullYear(), m = t.getMonth();
  return {month: [new Date(y, m, 1), t], prev: [new Date(y, m - 1, 1), new Date(y, m, 0)],
          h1: [new Date(y, m, 1), new Date(y, m, Math.min(15, t.getDate()))],
          h2p: [new Date(y, m - 1, 16), new Date(y, m, 0)]}[k].map(iso);
}

/* ------------------------------ подотчётные финансы (тех. директор вносит траты и отправляет ген. директору) */
const rub2 = n => (+n || 0).toLocaleString("ru-RU", {maximumFractionDigits: 2}) + " ₽";
const dm = s => { const d = fromIso(s); return `${d.getDate()} ${MONTHS[d.getMonth()]}`; };
/* Таблица трат: Наименование | Кол-во | Сумма. del — показывать крестик удаления (только у тех. директора) */
function moneyTable(items, total, del){
  if (!items.length) return `<div class="empty">Трат нет</div>`;
  return `<div class="card" style="padding:6px 10px"><table>
    <tr><th>Наименование</th><th class="n">Кол-во</th><th class="n">Сумма</th>${del ? "<th></th>" : ""}</tr>
    ${items.map((e, i) => `<tr><td><b>${esc(e.name)}</b><div class="ch">${esc(dm(e.day))}${del && e.sent ? " · уже отправлялось" : ""}</div></td>
      <td class="n">${hh(e.qty)}</td><td class="n" style="white-space:nowrap"><b>${rub2(e.amount)}</b></td>
      ${del ? `<td class="n" style="width:1%"><button class="btn" style="padding:8px 10px" onclick="moneyDel(${i})" aria-label="Удалить">✕</button></td>` : ""}</tr>`).join("")}
    <tr><td><b>Итого</b></td><td class="n">${items.length} поз.</td><td class="n" style="white-space:nowrap"><b>${rub2(total)}</b></td>${del ? "<td></td>" : ""}</tr>
  </table></div>`;
}
/* Остаток на руках: всё выданное − все траты. Минус — потратил больше, чем выдали (перерасход) */
function moneyBalance(a){
  if (!a) return "";
  return `<div class="stats" style="grid-template-columns:1fr 1fr 1fr">
    <div class="stat"><b style="font-size:17px;white-space:nowrap;line-height:32px">${rub2(a.issued)}</b><small>выдано</small></div>
    <div class="stat"><b style="font-size:17px;white-space:nowrap;line-height:32px">${rub2(a.spent)}</b><small>потрачено</small></div>
    <div class="stat"><b style="font-size:17px;white-space:nowrap;line-height:32px;${a.balance < 0 ? "color:var(--warn)" : ""}">${rub2(Math.abs(a.balance))}</b><small>${a.balance < 0 ? "перерасход" : "остаток"}</small></div></div>`;
}
function moneyIssues(a){
  if (!a || !a.issues.length) return `<div class="muted">Пока ничего не выдавали</div>`;
  return `<div class="card" style="padding:6px 10px"><table>${a.issues.map((x, i) => `<tr><td><b>${esc(dm(x.day))}</b>${x.note ? ` · ${esc(x.note)}` : ""}<div class="ch">записал(а) ${esc(x.by || "—")}</div></td>
    <td class="n" style="white-space:nowrap"><b>${rub2(x.amount)}</b></td>
    <td class="n" style="width:1%">${x.can_remove ? `<button class="btn" style="padding:8px 10px" onclick="issueDel(${i})" aria-label="Убрать выдачу">✕</button>` : ""}</td></tr>`).join("")}</table></div>`;
}
/* Сводка периода в отчёте: остаток на начало → выдано → потрачено → остаток на конец. В старых отчётах её нет */
function moneyFlow(r){
  if (r.end === undefined) return "";
  const line = (k, v, bold) => `<tr><td>${bold ? `<b>${k}</b>` : k}</td><td class="n" style="white-space:nowrap">${bold ? `<b>${v}</b>` : v}</td></tr>`;
  const bal = x => (x < 0 ? "−" : "") + rub2(Math.abs(x));
  return `<div class="card" style="padding:6px 10px"><table>
    ${line("Остаток на начало", bal(r.start))}
    ${line("Выдано за период", "+" + rub2(r.issued))}
    ${(r.issues || []).map(x => `<tr><td class="muted" style="border-top:0;padding-top:0" colspan="2">${esc(dm(x.day))}: ${rub2(x.amount)}${x.note ? ` — ${esc(x.note)}` : ""}</td></tr>`).join("")}
    ${line("Потрачено за период", "−" + rub2(r.total))}
    ${line(r.end < 0 ? "Перерасход на конец" : "Остаток на конец", `<span style="${r.end < 0 ? "color:var(--warn)" : ""}">${rub2(Math.abs(r.end))}</span>`, true)}
  </table></div>`;
}
/* Записать выдачу денег под отчёт. Тех. директор — «получил», ген. директор — «выдал»; попадает в один список */

/* ------------------------------ обновление APK
   APK 1.6+ умеет сам скачать и поставить новую версию (ArkNative.update). Старые APK без этого умения
   получают полоску со ссылкой — новую версию один раз ставят из браузера. */
async function checkUpdate(){
  const N = window.ArkNative; if (!N || document.querySelector(".updbar")) return;
  let cur = 0; try { cur = N.versionCode ? +N.versionCode() : 0; } catch(e) {}
  let v; try { v = await (await fetch("/app/version", {cache: "no-store"})).json(); } catch(e) { return; }
  if (!v || !v.code || (cur && v.code <= cur)) return;
  let skipped = 0; try { skipped = +sessionStorage.getItem("ark_upd_skip") || 0; } catch(e) {}
  if (skipped === v.code) return;
  const inApp = !!N.update;
  $("header").insertAdjacentHTML("afterend", `<div class="updbar" id="updbar"><div class="grow">
      <b>⬆️ Новая версия ${esc(v.version)}</b><small id="upd-note">${esc(v.notes || (inApp ? "Нажмите «Обновить», установка займёт минуту" : "Скачайте и установите поверх текущей"))}</small></div>
      ${inApp ? `<button id="upd-go">Обновить</button>` : `<a href="${esc(v.url)}">Скачать</a>`}
      <button class="x" aria-label="Позже" onclick="updLater(${v.code})">×</button></div>`);
  if (inApp) $("#upd-go").onclick = () => {
    $("#upd-go").disabled = true; $("#upd-go").textContent = "0%"; $("#upd-note").textContent = "Скачиваю…";
    try { N.update(v.url); } catch(e) { updFail("Не получилось начать загрузку"); }
  };
}
function updLater(code){ try { sessionStorage.setItem("ark_upd_skip", code); } catch(e) {} const b = $("#updbar"); if (b) b.remove(); }
function updFail(msg){
  const go = $("#upd-go"); if (go) { go.disabled = false; go.textContent = "Повторить"; }
  const n = $("#upd-note"); if (n) n.textContent = msg; toast(msg);
}

  const go = $("#upd-go"); if (go) { go.disabled = false; go.textContent = "Установить"; go.onclick = () => { try { window.ArkNative.installUpdate(); } catch(e) {} }; }
};

/* ------------------------------ чат

   Сервер держит запрос, пока не появится новое («долгий запрос»), — так сообщения и значки приходят сразу. */
let chat = {msgs: [], rev: 0, last: 0, epoch: "", busy: false, timer: null, sending: false, reply: 0, photo: null};
/* Личные сообщения: у каждого диалога своё такое же состояние, chat указывает на открытый (общий — CHAT_ALL).
   chatView: "feed" — лента (общая или личная), "list" — список людей для личной переписки */
const CHAT_ALL = chat, dmRooms = {};
let chatView = "feed";
const chatUrl = sub => (chat.peer ? "/api/dm" : "/api/chat") + sub;
const draftKey = () => "ark_chat_draft" + (chat.peer ? "_" + chat.peer : "");
const IC = {
  back: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 5l-7 7 7 7"/></svg>`,
  smile: `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0"/><path d="M9 9.5v.6M15 9.5v.6" stroke-width="2.4"/></svg>`,

  ck1: `<svg width="15" height="10" viewBox="0 0 15 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5.300l3 3 6-7"/></svg>`,

/* цвет аватарки и имени — свой у каждого человека, всегда один и тот же */
const AVA = ["#e0574f", "#e08a2e", "#3aa55d", "#2f9bd6", "#7a6ef0", "#d057b0", "#12a7a0"];
const hue = n => { let h = 0; for (const c of String(n || "")) h = (h * 31 + c.charCodeAt(0)) >>> 0; return AVA[h % AVA.length]; };
const ava1 = n => esc((String(n || "?").trim().charAt(0) || "?").toUpperCase());
/* Общий чат на экране и приложение не свёрнуто — значит, всё пришедшее человек увидел */
function chatMarkSeen(){
  if (tab === "chat" && chatView === "feed" && !chat.peer && !document.hidden && CHAT_ALL.last > chatSeen()) chatSeen(CHAT_ALL.last);
}
function chatSeen(v){
  try { if (v !== undefined) localStorage.setItem("ark_chat_seen", String(v)); return +localStorage.getItem("ark_chat_seen") || 0; }
  catch(e) { return v || 0; }
}
/* Новые сообщения. Пока приложение на экране, сервер держит запрос до 25 сек и отвечает, как только что-то
   появилось («долгий запрос»): в чате сообщение приходит сразу, на других вкладках сразу обновляется значок.
   Свёрнутое приложение запросов не держит — там работают пуш-уведомления. */
async function chatPoll(room){
  room = room || chat;
  if (room !== chat) return;  // сработал таймер старого диалога
  clearTimeout(room.timer);
  if (!(me && me.ok) || room.busy) return;  // запрос уже идёт — он сам запланирует следующий
  if (tab === "chat" && chatView === "list") return;  // в списке людей свой опрос — dmListPoll
  if (document.hidden) { room.timer = setTimeout(() => chatPoll(room), 5000); return; }
  let ok = false;
  room.busy = true;
  try {
    const since = room.epoch ? room.rev : 0, w = since ? "&wait=1" : "";
    if (!room.peer) chatMarkSeen();
    const seenQ = `&seen=${chatSeen()}`, first = !room.epoch;
    const d = await call(room.peer ? `/api/dm?peer=${encodeURIComponent(room.peer)}&since=${since}${w}${seenQ}${room.presence ? "&on=" + (room.presence.online ? 1 : 0) : ""}${w ? "&rd=" + (room.read ?? -1) : ""}`
                                   : `/api/chat?since=${since}${w}${seenQ}${w ? `&du=${window._dmUnread || 0}&ep=${encodeURIComponent(room.epoch)}&rd=${room.read ?? -1}&on=${room.online ?? -1}` : ""}`);
    ok = true;
    if (room !== chat) return;  // пока ждали ответ, человек открыл другой диалог
    if ("dm_unread" in d) window._dmUnread = d.dm_unread;
    if (room.peer && "all_unread" in d) window._allUnread = d.all_unread;
    room.read = d.read || 0;
    if (!room.peer) { room.online = d.online; room.total = d.total; const o = document.getElementById("chat-on"); if (o) o.textContent = onlineText(); }
    if (room.peer && d.peer) { room.presence = d.peer; if (tab === "chat" && chatView === "feed") dmStatus(); }
    if (d.epoch !== room.epoch) { room.msgs = []; room.rev = 0; room.epoch = d.epoch; }  // сервер перезапустился — берём всё заново
    // приходят и новые, и отредактированные сообщения: новые дописываем, изменённые заменяем

}
