plugins {
    id 'com.android.application'
}
// Firebase (мгновенные уведомления) подключается, только если в сборку положен google-services.json
// (его берёт из Secrets GitHub сборщик). Без файла APK собирается и уведомления приходят раз в 15 минут.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

// Номер версии берётся из номера сборки на GitHub, чтобы телефон видел обновление
def build = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'ru.arkenstone.app'
    compileSdk 34

    defaultConfig {
        applicationId 'ru.arkenstone.app'
        minSdk 24
        targetSdk 34
        versionCode build
        versionName "1.${build}"
    }

    // Постоянный ключ подписи берётся из закрытых настроек GitHub (Secrets), а не из кода.
    // Пока его нет, APK подписывается временным ключом сборщика.
    def ks = file('release.keystore')
    signingConfigs {
        if (ks.exists()) {
            release {
                storeFile ks
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS") ?: "arkenstone"
                keyPassword System.getenv("KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ks.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'com.google.firebase:firebase-messaging:24.0.3'
}
